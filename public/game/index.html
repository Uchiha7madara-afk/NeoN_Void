<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON VOID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#05010a; }
  canvas { display:block; cursor:none; }
  #boot-error {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    color:#eaf6ff; font-family:Arial, sans-serif; background:#05010a; z-index:10;
    text-align:center; padding:24px; line-height:1.8;
  }
  /* ---- DOM menu layer (letterboxed exactly like the canvas world) ---- */
  #ui { position:absolute; transform-origin:0 0; display:none; cursor:default; z-index:5;
        font-family:'Orbitron', Arial, sans-serif; user-select:none; }
  #title { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:13px;
           background: radial-gradient(ellipse at 50% 40%, rgba(34,0,66,.38), rgba(5,1,10,.86)); }
  .logo { font-weight:900; font-size:62px; letter-spacing:10px; color:#2cf6ff;
          text-shadow:0 0 8px #2cf6ff, 0 0 30px rgba(44,246,255,.55), 3px 3px 0 rgba(255,46,196,.85);
          animation:flick 4.6s infinite; line-height:1; }
  @keyframes flick { 0%,100%{opacity:1} 91%{opacity:1} 92%{opacity:.55} 93%{opacity:1}
                     96%{opacity:.7} 97%{opacity:1} }
  .tag { font-weight:500; font-size:12px; letter-spacing:9px; color:#8f7fb8; }
  .statline { font-weight:700; font-size:14px; letter-spacing:3px; color:#eaf6ff; margin-top:2px; }
  .statline b { color:#ffd23c; }
  .pills { display:flex; gap:10px; }
  .pill { font-weight:700; font-size:12px; letter-spacing:2px; color:#8f7fb8;
          border:1.5px solid rgba(143,127,184,.4); background:rgba(10,0,20,.6);
          padding:6px 18px; border-radius:3px; cursor:pointer; }
  .pill:hover { border-color:rgba(44,246,255,.6); color:#2cf6ff; }
  .pill.on { color:#0a0014; background:#2cf6ff; border-color:#2cf6ff;
             box-shadow:0 0 14px rgba(44,246,255,.7); }
  .sect { font-weight:700; font-size:10px; letter-spacing:5px; color:#6b5f8e; margin-top:2px; }
  .cards { display:flex; gap:12px; }
  .card { width:196px; border:1.5px solid rgba(44,246,255,.28); background:rgba(10,0,24,.74);
          border-radius:5px; padding:10px 13px; }
  .card.eq { border-color:#2cf6ff; box-shadow:0 0 16px rgba(44,246,255,.3); }
  .card h4 { font-weight:700; font-size:15px; letter-spacing:3px; color:#eaf6ff; margin:0 0 4px; }
  .card .st { font-weight:500; font-size:10px; color:#8f7fb8; letter-spacing:1px; line-height:1.75; }
  .card button, .upg button {
          margin-top:7px; width:100%; font-family:'Orbitron',Arial; font-weight:700; font-size:11px;
          letter-spacing:1px; padding:6px 0; border-radius:3px; cursor:pointer;
          border:1.5px solid #ffd23c; color:#ffd23c; background:transparent; }
  .card button:hover:not(:disabled), .upg button:hover:not(:disabled) {
          background:#ffd23c; color:#0a0014; box-shadow:0 0 12px rgba(255,210,60,.55); }
  .card button:disabled, .upg button:disabled { opacity:.35; cursor:default; }
  .card button.own { border-color:#9dff3c; color:#9dff3c; }
  .card button.own:hover { background:transparent; box-shadow:none; }
  .card button.eqd { background:#2cf6ff; color:#0a0014; border-color:#2cf6ff; }
  .upgs { display:flex; gap:10px; }
  .upg { width:196px; border:1.5px solid rgba(157,255,60,.25); background:rgba(10,0,24,.74);
         border-radius:5px; padding:9px 13px; }
  .upg.owned { border-color:rgba(157,255,60,.55); }
  .upg h5 { font-weight:700; font-size:12px; letter-spacing:2px; color:#9dff3c; margin:0 0 3px; }
  .upg .st { font-weight:500; font-size:10px; color:#8f7fb8; line-height:1.5; min-height:30px; }
  .upg button.owned { border-color:#9dff3c; color:#9dff3c; }
  .startrow { display:flex; align-items:center; gap:26px; margin-top:4px; }
  .toggle { display:flex; align-items:center; gap:8px; font-weight:600; font-size:11px;
            color:#8f7fb8; cursor:pointer; letter-spacing:2px; }
  .toggle input { accent-color:#2cf6ff; width:15px; height:15px; cursor:pointer; }
  #startBtn { font-family:'Orbitron',Arial; font-weight:900; font-size:21px; letter-spacing:7px;
              padding:13px 58px; color:#0a0014; border:none; border-radius:4px; cursor:pointer;
              background:linear-gradient(90deg,#2cf6ff,#ff2ec4);
              box-shadow:0 0 22px rgba(255,46,196,.45), 0 0 22px rgba(44,246,255,.35);
              animation:breathe 1.7s infinite; }
  #startBtn:hover { transform:scale(1.05); }
  @keyframes breathe {
    0%,100% { box-shadow:0 0 14px rgba(255,46,196,.35), 0 0 14px rgba(44,246,255,.25); }
    50%     { box-shadow:0 0 30px rgba(255,46,196,.7), 0 0 30px rgba(44,246,255,.55); } }
  .legend { font-weight:500; font-size:10px; letter-spacing:2px; color:#6b5f8e; }
  .shopmsg { font-weight:700; font-size:11px; letter-spacing:2px; color:#ff2b4e;
             min-height:15px; opacity:0; transition:opacity .25s; }
</style>
</head>
<body>
<div id="boot-error">NEON VOID could not load its renderer.<br>PixiJS loads from a CDN — check your internet connection and reload.</div>
<div id="ui">
  <div id="title">
    <div class="logo">NEON VOID</div>
    <div class="tag">TOP-DOWN NEON ARENA</div>
    <div class="statline" id="statline"></div>
    <div class="pills" id="diffPills"></div>
    <div class="sect">HANGAR — SHIPS</div>
    <div class="cards" id="shipCards"></div>
    <div class="sect">UPGRADES</div>
    <div class="upgs" id="upgRow"></div>
    <div class="startrow">
      <label class="toggle"><input type="checkbox" id="afToggle"> AUTO-FIRE</label>
      <button id="startBtn">ENGAGE</button>
    </div>
    <div class="legend">WASD MOVE &nbsp;·&nbsp; MOUSE AIM &nbsp;·&nbsp; LMB FIRE &nbsp;·&nbsp; SPACE / SHIFT DASH &nbsp;·&nbsp; F AUTO-FIRE &nbsp;·&nbsp; P PAUSE &nbsp;·&nbsp; M MUTE &nbsp;·&nbsp; R RETRY</div>
    <div class="shopmsg" id="shopMsg"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-filters@6/dist/pixi-filters.min.js"></script>
<script>
/* ============================================================
   NEON VOID v1.0 — full build (single file)
   Bands map 1:1 to the future src/ split.
   All tuning lives in CFG. All shapes generated at runtime.
   ============================================================ */
(async () => {

function bootFail () {
  const el = document.getElementById('boot-error');
  if (el) el.style.display = 'flex';
}
if (typeof PIXI === 'undefined') { bootFail(); return; }

/* ===== 00 CONFIG ===== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const rand  = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const damp  = (rate, dt) => 1 - Math.exp(-rate * dt);
function lerpAngle (a, b, t) {
  let d = (b - a) % TAU;
  if (d >  Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return a + d * t;
}
function lerpColor (c1, c2, t) {
  const r = ((c1 >> 16 & 255) + ((c2 >> 16 & 255) - (c1 >> 16 & 255)) * t) | 0;
  const g = ((c1 >> 8 & 255) + ((c2 >> 8 & 255) - (c1 >> 8 & 255)) * t) | 0;
  const b = ((c1 & 255) + ((c2 & 255) - (c1 & 255)) * t) | 0;
  return (r << 16 | g << 8 | b) & 0xffffff;
}

const CFG = {
  world: { w: 1280, h: 720, bound: 24, spawnInset: 46 },

  colors: {
    bg:      0x0a0014,   // arena floor
    bar:     0x05010a,   // letterbox
    grid:    0x9d5cff,   // faint purple grid
    border:  0xa44dff,   // arena border
    player:  0x2cf6ff,   // cyan
    core:    0xdfffff,   // near-white cores
    trail:   0xff2ec4,   // pink engine
    drone:   0xff2b4e, droneHi: 0xffd9de,      // red
    // hunter colors derive from CFG.enemies.hunter.colorPrimary (Phase 2A — single source)
    // spinner colors derive from CFG.enemies.spinner.colorPrimary (Phase 2A.2 — single source)
    tank:    0x3cff6e, tankHi: 0xd6ffe2,       // green
    coin:    0xffd23c, heart: 0xff4d6d, gunpk: 0x9dff3c,
    text:    '#eaf6ff',
    textDim: '#8f7fb8',
  },

  bloom: { threshold: 0.22, bloomScale: 0.85, brightness: 1.12, blur: 7 },

  // gun tiers 1..5 — single → twin → spread → lance → nova
  gunTiers: [
    { name: 'PULSE',  rate: 8.0, count: 1, spread: 0,     parallel: false, speed: 780,  dmg: 1, pierce: 0, life: 1.05, wave: 0,    tex: 'bullet' },
    { name: 'TWIN',   rate: 8.6, count: 2, spread: 0.05,  parallel: true,  speed: 800,  dmg: 1, pierce: 0, life: 1.05, wave: 0,    tex: 'bullet' },
    { name: 'SPREAD', rate: 7.2, count: 3, spread: 0.15,  parallel: false, speed: 760,  dmg: 1, pierce: 0, life: 0.9,  wave: 0,    tex: 'bullet' },
    { name: 'LANCE',  rate: 6.2, count: 1, spread: 0.006, parallel: false, speed: 1150, dmg: 3, pierce: 2, life: 0.85, wave: 0,    tex: 'lance'  },
    { name: 'NOVA',   rate: 5.6, count: 5, spread: 0.32,  parallel: false, speed: 820,  dmg: 1, pierce: 0, life: 1.0,  wave: 0.55, tex: 'bullet' },
  ],

  player: {
    accel: 2600, maxSpeed: 360, drag: 4.2,
    turnLerp: 18,
    radius: 9,            // hitbox — deliberately smaller than the sprite
    hp: 3, iframes: 1.5,
    bulletSpread: 0.014,
    wallBounce: 0.45,
    // PHASE 2B — basic dash (ships as the chassis for DASH CHARGE / FAST DASH
    // cards). SHIFT or SPACE spends one charge: short velocity burst + brief
    // i-frames. Charges recharge one at a time; cards add capacity / cut cd.
    dash: {
      charges: 1,           // base charges (DASH CHARGE card: +1 each)
      cooldownMs: 1600,     // per-charge recharge (FAST DASH card: -40% each)
      speed: 880,           // burst velocity (bypasses maxSpeed while dashing)
      timeMs: 140,          // burst duration
      iframesMs: 220,       // brief ghost window on trigger
    },
  },

  drone: {
    radius: 13, hp: 1, hpPerTier: 0,
    baseSpeed: 62, speedRamp: 0.075, speedCap: 2.5,
    accel: 300,
    weaveFreq: 2.1, weaveAmp: 0.55,
    sepDist: 34, sepForce: 150,
    spin: 1.3, pulseAmp: 0.09, pulseRate: 3.2,
    score: 100,
  },
  // Phase 2A — HUNTER "stop and time it": approaches to range, plants, draws
  // the lead line (dim purple -> bright white), fires ONE lead shot at where
  // you are GOING. Vulnerable the whole wind-up — reading the telegraph is
  // the reward. Replaces the old orbit + charge hunter (ring/fireMin/fireMax/
  // charge/predict retired with it).
  enemies: {
    hunter: {
      radius: 17,             // hitbox — 1.3x drone (drone 13); sprite baked to match
      hp: 2, hpPerTier: 1,    // survives one hit (hpPerTier = existing tier ramp)
      speed: 90,              // approach speed — x sharedSpeedMult like every enemy
      accel: 360,             // steering ease (same accel model as drone/tank)
      score: 250,
      fireRange: 320,         // plants + winds up once inside this distance
      windUpMs: 350,          // telegraph duration — THE readability lever
      cooldownMs: 900,        // stalk time between shots
      bulletSpeed: 220,       // dodgeable — far slower than player bullets (780+)
      bulletDamage: 1,
      leadFactor: 1.0,        // 1.0 = perfect lead; tune down if too punishing
      aimLineWidth: 1.5,
      aimLineAlphaStart: 0.25,
      aimLineAlphaEnd: 1.0,
      colorPrimary: 0xc000ff, // body / telegraph ring / aim line / kill juice
      colorBullet: 0xff4080,  // orb + comet trail + muzzle flash
    },

    // Phase 2A.2 — SPINNER "find the gap": never chases. Drifts lazily, spins
    // in place, then on a readable rhythm stops, charges (faster spin +
    // expanding ring), and drops the whole radial ring AT ONCE — then drifts
    // again. The spray offset rotates half a gap each cycle, so parking in
    // one safe spot fails. Replaces the v1.0 spiral sprayer (sprayEvery/
    // sprayDur/coolDur/sprayRot retired with it).
    spinner: {
      radius: 11,             // hitbox — slightly smaller than the drone (13); sprite baked to match
      hp: 3, hpPerTier: 1,    // tankier than a drone, far from tank-tier (hpPerTier = existing tier ramp)
      speed: 40,              // DRIFT speed — a lazy wander, never a chase (x sharedSpeedMult)
      accel: 130,             // drift steering ease (v1.0 value kept)
      score: 400,             // (v1.0 value kept — rich drops stay too)
      driftTimeMs: 1400,      // DRIFT duration between sprays
      windUpMs: 500,          // telegraph — THE lever: can you read the pulse?
      sprayRecoveryMs: 200,   // SPRAY -> DRIFT beat
      bulletCount: 8,         // 8 bullets, 8 gaps — position BETWEEN them
      bulletAngleOffset: 0,   // base offset; the per-cycle gap shift is applied internally
      bulletSpeed: 180,       // slower than hunter orbs (220) — dodge through the gaps
      bulletDamage: 1,
      spinRateIdle: 0.4,      // sprite rotations/sec at rest — reads mechanical
      spinRateWindup: 2.0,    // sprite rotations/sec during the charge
      chargeRingRadius: 40,   // charge telegraph expands outward to this
      chargeRingAlpha: 0.7,
      colorPrimary: 0xffcc00, // body / charge ring / halo / kill juice
      colorBullet: 0xffaa44,  // yellow-orange orbs
    },
  },
  tank: {
    radius: 23, hp: 22, hpPerTier: 6,
    baseSpeed: 34, accel: 95,
    score: 600, fireCd: 3.3, ringCount: 8, ringSpeed: 150,
    knock: 1.9,
  },

  waves: {
    budget:        w => 3 + w * 1.9 + Math.pow(w, 1.18),
    spawnInterval: w => Math.max(0.38, 1.25 - w * 0.07),
    breather: 2.4, telegraph: 0.7, minPlayerDist: 190,
    unlock: { hunter: 3, spinner: 5, tank: 7 },
    cost:   { drone: 1, hunter: 3, spinner: 4, tank: 7 },
    // hunter 0.32 — Phase 2A spawn spec: yields ~1 hunter per 4 drones at
    // wave 3-4 (weight 0.25 under-delivers once the sub-3-budget tail forces
    // all-drones picks; 0.32 lands the observed count ratio on ~0.25).
    // spinner 0.22 — Phase 2A.2 spawn spec: ~1 spinner per 6 drones at wave
    // 5-6 (same tail-truncation calibration as the hunter weight above).
    weights:{ drone: 1.0, hunter: 0.32, spinner: 0.22, tank: 0.25 },
    tierEvery: 5, speedCap: 1.9, maxActive: 26,
    clearBonus: w => w * 50,
  },

  drops: {
    drone:   { coin: 0.14, gun: 0.02, heart: 0.03 },
    hunter:  { coin: 0.50, gun: 0.07, heart: 0.08 },
    spinner: { coin: 0.85, gun: 0.12, heart: 0.12 },
    tank:    { coins: () => 2 + (Math.random() < 0.5 ? 1 : 0), gun: 0.5, heart: 0.5 },
  },

  pickup: { magnetR: 110, collect: 26, life: 9, pull: 900, pullCap: 520, maxField: 12, coinValue: 5 },

  combo: { window: 2.6, step: 0.1, cap: 5 },

  diff: {
    easy:   { label: 'EASY',   hpBonus: 1, speed: 0.85, bullet: 0.80, budget: 0.80, iframes: 1.8, mult: 0.8  },
    normal: { label: 'NORMAL', hpBonus: 0, speed: 1.00, bullet: 1.00, budget: 1.00, iframes: 1.5, mult: 1.0  },
    hard:   { label: 'HARD',   hpBonus: 0, speed: 1.14, bullet: 1.12, budget: 1.30, iframes: 1.1, mult: 1.35 },
  },

  ships: {
    vector: {
      name: 'VECTOR', cost: 0, flavor: 'BALANCED INTERCEPTOR',
      accel: 2600, maxSpeed: 360, drag: 4.2, hp: 3, radius: 9, scale: 1.0,
      color: 0x2cf6ff, trail: 0xff2ec4, pts: [19, 0, -13, -12, -6, 0, -13, 12],
      stats: 'SPD 360 · HP 3 · HIT 9',
    },
    wasp: {
      name: 'WASP', cost: 300, flavor: 'FAST · FRAGILE FEEL',
      accel: 3300, maxSpeed: 445, drag: 4.6, hp: 3, radius: 8, scale: 0.9,
      color: 0x9dff3c, trail: 0x2cf6ff, pts: [21, 0, -15, -9, -5, 0, -15, 9],
      stats: 'SPD 445 · HP 3 · HIT 8',
    },
    juggernaut: {
      name: 'JUGGERNAUT', cost: 600, flavor: 'HEAVY · EXTRA PLATING',
      accel: 2200, maxSpeed: 300, drag: 4.0, hp: 4, radius: 11, scale: 1.15,
      color: 0xffa23c, trail: 0xffe14d, pts: [19, 0, -15, -14, -8, 0, -15, 14],
      stats: 'SPD 300 · HP 4 · HIT 11',
    },
  },

  upgrades: {
    // -- meta shop (persistent, bought in the hangar) --
    twin:       { name: 'TWIN CANNON', cost: 250, desc: 'Deploy at gun tier 2 — TWIN' },
    overcharge: { name: 'OVERCHARGE',   cost: 400, desc: '+18% fire rate, all guns' },
    magnet:     { name: 'MAGNETIZER',   cost: 300, desc: '+70% pickup magnet radius' },
    // -- PHASE 2B — RUN CARDS (per-run, never persisted). Card CONTENT (ids/
    //    names/desc/category/unique) lives in band 14; the NUMBERS live here.
    screenMs: 1000,         // delay between wave clear and the card screen
    cardGrowScale: 1.05,    // hover grow
    dimAlpha: 0.6,          // arena dim behind the cards
    cardW: 210, cardH: 300, cardGap: 40,
    absorbMs: 420,          // card -> ship fly-and-absorb duration
    // per-card numbers (referenced by the fire path / movement / pickups)
    fastFirePct: 0.25,      // FAST FIRE: +25% fire rate per stack
    quickFeetPct: 0.20,     // QUICK FEET: +20% move speed per stack
    pierceAdd: 1,           // PIERCE: +1 pass-through per stack
    spreadBullets: 2,       // SPREAD: +2 bullets per shot per stack
    spreadArcAdd: 0.12,     // SPREAD: wider fan arc per stack (radians half-arc)
    spreadDmgCut: 1,        // SPREAD: -1 bullet damage (the trade)
    dashChargeAdd: 1,       // DASH CHARGE: +1 charge per stack (granted ready)
    fastDashCut: 0.40,      // FAST DASH: -40% dash cooldown per stack
    maxHpAdd: 1,            // MAX HP: +1 max HP
    maxHpHeal: 1,           // MAX HP: heal 1 on pick
    regenWaves: 3,          // REGEN: heal every N wave starts
    regenHeal: 1,           // REGEN: heal amount per proc (x stacks)
    lastStandRadius: 80,    // LAST STAND: kill radius on hit (+ victim radius)
    explosiveRadius: 12,    // EXPLOSIVE KILLS: burst radius (SPEC-LITERAL 12px —
                            // that is sub-drone; raise if it never chains)
    explosiveDamage: 2,     // EXPLOSIVE KILLS: burst damage to neighbors
    magnetRadiusPct: 0.50,  // MAGNET: +50% pickup radius per stack
    magnetCoinPct: 0.25,    // MAGNET: +25% coin gain per stack
  },

  feel: {
    shakeMax: 16, traumaDecay: 1.7,
    traumaKill: 0.34, traumaHurt: 0.85, traumaWall: 0.10,
    hitstopKill: 0.05, hitstopHurt: 0.10,
    gridPulseKill: 0.55, gridPulseDecay: 2.4,
    hurtFlash: 0.24,
    dyingSlowmo: 0.22, dyingTime: 0.85,   // retired by JUICE 5 (superseded by juice.death.slowMo*)
    rgbHurt: 0.22, rgbMag: 9,
  },

  // ===== JUICE (Day 1 pass — tune feel by editing numbers only) =====
  juice: {
    ship: {
      // a) engine trail — ghost afterimages of the ship
      trailLength: 12,      // ring buffer: past positions rendered as ghosts
      trailFade: 0.30,      // seconds ghosts take to fade in / melt out (bigger = softer, longer-feeling trail)
      trailAlpha: 0.6,      // freshest ghost alpha (fades to 0 along the tail)
      trailMinSpeed: 30,    // px/s below which the trail vanishes
      trailFullAt: 0.5,     // fraction of maxSpeed at which the trail is fully bright
      // b) banking — lean into lateral velocity (visual only, never affects aim)
      bankAngle: 18,        // degrees of lean at full lateral speed
      bankEase: 10,         // ease in/out rate (higher = snappier)
      // c) thrust pulse — bright flicker at the rear when moving
      pulseRate: 12,        // Hz — randomized per frame so it never reads as a metronome
      pulseMinSpeed: 25,    // px/s below which the engine stays dark
      // d) squash & stretch — along the movement direction, eased
      squashAmount: { stretch: 1.08, squash: 0.94 },
      squashEase: 12,       // ease in/out rate for deformation (higher = snappier)
      stretchFullAt: 0.55,  // fraction of maxSpeed at which deformation reaches full amount
    },

    // ===== JUICE ITEM 2 — THE KILL MOMENT (all tunables live here) =====
    kill: {
      // 1) white flash — enemy sprite renders pure white for exactly this many
      //    rendered frames BEFORE the burst lands (sells the hit before the pop).
      //    On 144Hz+ displays raise to 3-4 if the flash reads too fast.
      whiteFlashFrames: 2,
      // 2) particle burst — enemy-colored shards, radial, shrink + fade out
      particleCount: 12,
      particleSpeedMin: 80,   // px/s
      particleSpeedMax: 200,  // px/s
      particleLifetimeMs: 400,
      // 3) shockwave ring — starts at enemy radius, expands to shockwaveScale x
      shockwaveScale: 3.0,
      shockwaveMs: 250,
      // 4) screen shake — directional jolt per kill, stacks additively, capped
      shakeAmount: 6,         // px
      shakeDurationMs: 120,
      shakeMaxStack: 12,      // px cap so chains stay readable
      // 5) hit-stop — the ENTIRE loop freezes for this long on every kill
      hitStopMs: 60,
      // 6) score popup — floats up popupRise px over popupDurationMs, cyan
      popupRise: 40,          // px
      popupDurationMs: 600,
    },

    // ===== JUICE ITEM 3 — GRID REACTS (all tunables live here) =====
    grid: {
      // a) shoot flash — whole-grid brightening on every player shot
      shootFlashAmount: 0.15, // brightness bump (additive on baseline)
      shootFlashMs: 80,       // eases back to baseline over this long
      // b) kill pulse — LOCAL radial grid ripple at the kill point, enemy color
      killPulseRadius: 120,   // px the ripple expands to
      killPulseMs: 200,       // expansion time
      killPulseAlpha: 0.6,    // starting alpha, fades linearly to 0
      // c) breathing idle — no enemies: slow sine between the two levels
      breathMin: 0.6,
      breathMax: 0.8,
      breathPeriodMs: 3000,
      // d) combat intensity — baseline scales with enemy count, eased
      //    target = intensityBase + min(intensityMax - intensityBase, count * intensityScale)

function fxUpdate (dt, rawDt) {
  // JUICE ITEM 3 — the grid reads its brightness from CFG.juice.grid:
  //   baseline = max(breathing idle (c), combat intensity (d)) — user-tuned:
  //   combat can raise the floor but must never dim the grid below idle.
  //   Eased, never snaps. The whole-grid shoot flash (a) stacks on top.
  //   The kill pulse (b) is local (see band 03).
  const KG = CFG.juice.grid;
  const ph = 0.5 + 0.5 * Math.sin(TAU * S.time * 1000 / KG.breathPeriodMs);
  const breath = KG.breathMin + (KG.breathMax - KG.breathMin) * ph;
  if (S.mode === 'over') {
    // JUICE 5b — the arena holds its breath on the game-over screen: baseline
    // frozen (no breathing, no combat response), only the shoot flash decays.
  } else {
    let nEnemies = 0;
    for (const e of enemyPool.items) if (e.active && !e.dying) nEnemies++;
    let gTarget = breath;                          // idle floor = breathing sine
    if (nEnemies > 0) {
      const combat = KG.intensityBase + Math.min(KG.intensityMax - KG.intensityBase, nEnemies * KG.intensityScale);
      gTarget = Math.max(breath, combat);          // combat never dims below idle
    }
    S.gridBase += (gTarget - S.gridBase) * damp(3 / (KG.intensityEaseMs / 1000), rawDt);
  }
  S.gridShoot = Math.max(0, S.gridShoot - (KG.shootFlashAmount / (KG.shootFlashMs / 1000)) * rawDt);
  gridC.alpha = clamp(S.gridBase + S.gridShoot, 0, 1.6);
  borderC.alpha = 0.78 + 0.22 * Math.sin(S.time * 2.1);

  // trauma → shake (decays in real time so shake survives hit-stop)
  S.trauma = Math.max(0, S.trauma - CFG.feel.traumaDecay * rawDt);
  const mag = S.trauma * S.trauma * CFG.feel.shakeMax;
  S.shakeX = (Math.random() * 2 - 1) * mag;
  S.shakeY = (Math.random() * 2 - 1) * mag * 0.85;

  // JUICE 2.4 — additive kill shake: fixed random direction per kill, ease-out
  // decay, stacks to shakeMaxStack. Ticks on rawDt so the jolt keeps playing
  // through the hit-stop freeze (feedback survives, gameplay freezes).
  if (S.kMag > 0) {
    S.kT += rawDt;
    const kk = S.kT / S.kDur;
    if (kk >= 1) { S.kMag = 0; S.kx = 0; S.ky = 0; }
    else {
      const km = S.kMag * (1 - kk) * (1 - kk);
      S.kx = Math.cos(S.kAng) * km;
      S.ky = Math.sin(S.kAng) * km;
    }
  }
  worldRoot.position.set(offX + S.shakeX + S.kx, offY + S.shakeY + S.ky);
  worldRoot.rotation = ((Math.random() * 2 - 1) * mag) * 0.0012;

  // fullscreen damage flash
  S.flashA = Math.max(0, S.flashA - 3.5 * rawDt);
  flashRect.alpha = S.flashA;

  // RGB split — hurt chromatic aberration, decays fast
  if (rgbF) {
    S.rgbT = Math.max(0, S.rgbT - rawDt);
    const k = (S.rgbT / CFG.feel.rgbHurt) * CFG.feel.rgbMag;
    rgbF.red = [k, 0];
    rgbF.green = [0, k * 0.6];
    rgbF.blue = [-k * 0.5, 0];
  }

  // JUICE 5a — red edge vignette decays linearly over vignetteMs (real time)
  const DKv = CFG.juice.death;
  S.vigA = Math.max(0, S.vigA - (DKv.vignetteAlpha / Math.max(0.001, DKv.vignetteMs / 1000)) * rawDt);
  vignetteSpr.alpha = S.vigA;
}

// "Zero asset files" ≠ zero GPU textures: we draw vectors once and bake them.
function bake (draw, res = 2) {

  g.destroy();

}
function neonPoly (g, pts, fillColor, glowColor, coreColor, hw, mw, cw, fa) {
  g.poly(pts).fill({ color: fillColor, alpha: 1 });
  g.poly(pts).stroke({ width: hw, color: glowColor, alpha: 0.20, join: 'round' });
  g.poly(pts).stroke({ width: mw, color: glowColor, alpha: 0.85, join: 'round' });
  g.poly(pts).stroke({ width: cw, color: coreColor, alpha: fa, join: 'round' });
}

// Generic fixed-size pool. Objects get .active/.visible toggles.
function makePool (n, factory, layer) {
  const items = [];
  for (let i = 0; i < n; i++) {
    const o = factory();
    o.active = false; o.visible = false;
    layer.addChild(o);
    items.push(o);
  }
  return {
    items,
    get () {
      for (const o of items) if (!o.active) { o.active = true; o.visible = true; return o; }
      return null;
    },
    release (o) { o.active = false; o.visible = false; },
    releaseAll () { for (const o of items) { o.active = false; o.visible = false; } },
    countActive () { let c = 0; for (const o of items) if (o.active) c++; return c; },
  };
}
function spriteOf (tex) { const s = new PIXI.Sprite(tex); s.anchor.set(0.5); s.blendMode = 'add'; return s; }

// --- particles: sparks (diamonds) + embers (soft dots) + trails ---
const partPool = makePool(CFG.pools.particles, () => spriteOf(TEX.dot), fxL);
function emit (o) {
  const p = partPool.get();
  if (!p) return;
  p.texture = o.tex || TEX.dot;
  p.tint = o.tint ?? 0xffffff;
  p.x = o.x; p.y = o.y;
  p.vx = o.vx || 0; p.vy = o.vy || 0;
  p.life = p.maxLife = o.life || 0.5;
  p.size0 = o.size || 1; p.grow = o.grow || 0;
  p.drag = o.drag ?? 2.5;
  p.alpha0 = o.alpha ?? 1;
  p.alpha = p.alpha0;
  p.rotation = o.rot || 0;
  p.scale.set(o.size || 1);
}
// JUICE 2.2 — spec kill burst: enemy-colored shards, radial particleSpeedMin..
// particleSpeedMax px/s, gone in particleLifetimeMs, shrinking as they fade.
// Still the existing pooled emit() system — only the profile changed.
function burstKill (x, y, tint) {
  const KB = CFG.juice.kill;
  for (let i = 0; i < KB.particleCount; i++) {
    const a = rand(TAU), sp = rand(KB.particleSpeedMin, KB.particleSpeedMax);
    emit({
      tex: TEX.spark, tint, x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: KB.particleLifetimeMs / 1000, size: rand(0.5, 1.0), drag: 1.6, rot: rand(TAU),
    });
  }
}
function puff (x, y, n, tint, spread = 90) {
  for (let i = 0; i < n; i++) {
    const a = rand(TAU), sp = rand(30, spread);
    emit({ tex: TEX.dot, tint, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.2, 0.4), size: rand(0.5, 0.9), drag: 4 });
  }
}
function updateParticles (dt) {
  for (const p of partPool.items) {
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0) { partPool.release(p); continue; }
    const k = Math.exp(-p.drag * dt);
    p.vx *= k; p.vy *= k;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const t = p.life / p.maxLife;
    p.alpha = p.alpha0 * Math.min(1, t * 1.6);
    const sc = p.size0 * (p.grow ? 1 + (1 - t) * p.grow : (0.4 + 0.6 * t));
    p.scale.set(sc);
  }
}

// --- shockwave rings ---
const ringPool = makePool(CFG.pools.rings, () => spriteOf(TEX.ring), fxL);
function ring (x, y, tint, maxScale = 2.1, dur = 0.28, startScale = 0.3, alpha0 = 0.9) {
  const r = ringPool.get();
  if (!r) return;
  r.texture = TEX.ring; r.tint = tint;
  r.x = x; r.y = y; r.t = 0; r.dur = dur; r.maxScale = maxScale;
  r.s0 = startScale; r.a0 = alpha0;
  r.scale.set(startScale); r.alpha = alpha0;
}
function updateRings (dt) {

    if (!r.active) continue;
    r.t += dt;
    const k = r.t / r.dur;
    if (k >= 1) { ringPool.release(r); continue; }
    r.scale.set(lerp(r.s0, r.maxScale, 1 - Math.pow(1 - k, 2)));
    r.alpha = r.a0 * (1 - k);
  }
}

// --- JUICE 3b — localized grid ripples ("the grid rippled where it died") ---
// The patch is a canvas-baked fragment of grid lines inside a soft radial
// falloff. Ripples snap to the 64px lattice so the glowing lines sit exactly
// ON the real grid. Pooled, additive, tinted enemy color — the rest of the
// grid does not change.
TEX.gridPatch = (() => {
  const SZ = 512, C = SZ / 2, CELL = 128;          // 2 canvas px per logical px
  const cv = document.createElement('canvas');
  cv.width = cv.height = SZ;
  const ctx = cv.getContext('2d');
  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth = 2;
  for (let i = -2; i <= 2; i++) {
    const p = C + i * CELL;                        // lines every 64 logical px
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, SZ); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(SZ, p); ctx.stroke();
  }
  const grd = ctx.createRadialGradient(C, C, 0, C, C, C);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.55, 'rgba(255,255,255,1)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.globalCompositeOperation = 'destination-in';
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, SZ, SZ);
  return PIXI.Texture.from(cv);
})();

// JUICE 5a — red edge vignette (canvas radial gradient, clear center -> red
// edges). The DEATH beat flashes its sprite alpha vignetteAlpha -> 0 over
// vignetteMs; the texture itself never changes.
TEX.vignette = (() => {
  const cv = document.createElement('canvas');
  cv.width = 640; cv.height = 360;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(320, 180, 100, 320, 180, 330);
  g.addColorStop(0, 'rgba(255,43,78,0)');
  g.addColorStop(0.55, 'rgba(255,43,78,0)');
  g.addColorStop(0.8, 'rgba(255,43,78,0.55)');
  g.addColorStop(1, 'rgba(255,43,78,1)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 640, 360);
  return PIXI.Texture.from(cv);
})();
const ripplePool = makePool(CFG.pools.ripples, () => spriteOf(TEX.gridPatch), fxL);
function gridRipple (x, y, tint) {
  const KG = CFG.juice.grid;
  const r = ripplePool.get();
  if (!r) return;
  r.texture = TEX.gridPatch; r.tint = tint;
  r.x = Math.round(x / 64) * 64;                   // lattice snap = line alignment
  r.y = Math.round(y / 64) * 64;
  r.t = 0; r.dur = Math.max(1, KG.killPulseMs) / 1000;
  r.maxRad = KG.killPulseRadius; r.a0 = KG.killPulseAlpha;
  r.scale.set(0.001); r.alpha = r.a0;
}
function updateRipples (dt) {
  for (const r of ripplePool.items) {
    if (!r.active) continue;
    r.t += dt;
    const k = r.t / r.dur;
    if (k >= 1) { ripplePool.release(r); continue; }
    r.scale.set(Math.max(0.001, k * r.maxRad / 256));  // patch logical radius = 256
    r.alpha = r.a0 * (1 - k);
  }
}

// --- JUICE 4a — muzzle flash: one soft white flicker at the barrel per pull ---
// Pooled sprite + frame-exact countdown (same clock as the kill flash) so the
// 3-frame duration reads identically at any refresh rate. Static at the muzzle
// (no drift) so it never smears over the ship or the bullet trail.
const muzzlePool = makePool(CFG.pools.muzzles, () => spriteOf(TEX.dot), fxL);
function muzzleFlash (x, y, tint = 0xffffff) {
  const JB = CFG.juice.bullet;
  const m = muzzlePool.get();
  if (!m) return;
  m.texture = TEX.dot; m.tint = tint;
  m.x = x; m.y = y;
  m.t = Math.max(1, JB.muzzleFlashFrames);
  m.t0 = m.t;
  m.a0 = JB.muzzleFlashAlpha;
  m.alpha = m.a0;                        // first rendered frame shows the full flash
  m.scale.set(0.95);
}
function updateMuzzles () {
  for (const m of muzzlePool.items) {
    if (!m.active) continue;
    if (m.t <= 0) { muzzlePool.release(m); continue; }
    const k = m.t / m.t0;                // 1 -> 0 across the flicker
    m.alpha = m.a0 * k;
    m.scale.set(0.5 + 0.45 * k);
    m.t -= 1;                            // rendered-frame countdown
  }
}

// --- JUICE 4c — impact spark: tiny white shards on NON-lethal hits ---

// rise = total px the popup climbs; dur = seconds it lives.

    p.x += p.vx * dt;
    p.scale.set(lerp(1, 1.35, Math.max(0, 1 - k * 4)));

}

function playerReset () {
  const ship = CFG.ships[META.ship] || CFG.ships.vector;
  const D = DIFF();
  player.ship = ship;
  player.x = W / 2; player.y = H / 2;

function playerUpdate (dt) {
  if (!player.alive) return;
  const P = player;

  // thrust in world space (WASD), inertia + drag — ship stats override defaults
  let ax = (K.KeyD || K.ArrowRight ? 1 : 0) - (K.KeyA || K.ArrowLeft ? 1 : 0);
  let ay = (K.KeyS || K.ArrowDown ? 1 : 0) - (K.KeyW || K.ArrowUp ? 1 : 0);
  const mag = Math.hypot(ax, ay);
  P.thrust = mag > 0 ? 1 : 0;
  if (mag > 0) { ax /= mag; ay /= mag; }

  // ===== PHASE 2B — DASH (basic). SHIFT/SPACE spends a charge: velocity
  // burst that ignores the speed cap while it runs, brief i-frames, small
  // wake. Edge-triggered (no hold-to-dash) and recharges one charge at a
  // time; DASH CHARGE adds capacity, FAST DASH cuts the recharge.
  const dashKey = !!(K.ShiftLeft || K.ShiftRight || K.Space);
  if (dashKey && !P.dashHeld && P.dashT <= 0 && P.dashCharges > 0) {
    P.dashHeld = true;
    P.dashCharges--;
    P.dashT = PC.dash.timeMs / 1000;
    P.iframes = Math.max(P.iframes, PC.dash.iframesMs / 1000);
    P.vx = (mag > 0 ? ax : Math.cos(P.angle)) * PC.dash.speed;
    P.vy = (mag > 0 ? ay : Math.sin(P.angle)) * PC.dash.speed;
    if (P.dashCdT <= 0) P.dashCdT = dashCd();          // start recharging the spent charge
    puff(P.x, P.y, 6, P.ship.trail, 130);
    addTrauma(0.05);
    hudDash();
  }
  if (!dashKey) P.dashHeld = false;
  // dash charge recharge — one at a time, dashCd() respects FAST DASH
  if (P.dashMax !== dashChargesMax()) { P.dashMax = dashChargesMax(); buildDashPips(); }
  if (P.dashCharges < P.dashMax) {
    P.dashCdT -= dt;
    if (P.dashCdT <= 0) {
      P.dashCharges++;
      if (P.dashCharges < P.dashMax) P.dashCdT = dashCd();
      hudDash();
    }
  }

  if (P.dashT > 0) {
    P.dashT -= dt;                                     // burst: no accel/drag/cap
  } else {
    // QUICK FEET — scales accel AND the speed cap so the feel stays intact
    const feet = 1 + P.up.quickFeet * CFG.upgrades.quickFeetPct;
    P.vx += ax * P.ship.accel * feet * dt;
    P.vy += ay * P.ship.accel * feet * dt;
    const k = Math.exp(-P.ship.drag * dt);
    P.vx *= k; P.vy *= k;
    const cap = P.ship.maxSpeed * feet;
    const sp0 = Math.hypot(P.vx, P.vy);
    if (sp0 > cap) { P.vx *= cap / sp0; P.vy *= cap / sp0; }
  }
  const sp = Math.hypot(P.vx, P.vy);
  P.x += P.vx * dt; P.y += P.vy * dt;

  // soft walls — bounce + squash so the box feels physical
  const b = CFG.world.bound + P.ship.radius;
  let bounced = 0;
  if (P.x < b)     { P.x = b;     if (P.vx < 0) { P.vx *= -PC.wallBounce; bounced = 1; P.squashX = 0.16; } }
  if (P.x > W - b) { P.x = W - b; if (P.vx > 0) { P.vx *= -PC.wallBounce; bounced = 1; P.squashX = 0.16; } }
  if (P.y < b)     { P.y = b;     if (P.vy < 0) { P.vy *= -PC.wallBounce; bounced = 1; P.squashY = 0.16; } }
  if (P.y > H - b) { P.y = H - b; if (P.vy > 0) { P.vy *= -PC.wallBounce; bounced = 1; P.squashY = 0.16; } }
  if (bounced) { addTrauma(CFG.feel.traumaWall); puff(P.x, P.y, 4, 0x9d5cff, 70); }

  // face the cursor (smoothed so aim stays readable)
  const ta = Math.atan2(M.y - P.y, M.x - P.x);
  P.angle = lerpAngle(P.angle, ta, damp(PC.turnLerp, dt));

  // (old particle engine trail replaced by the afterimage rig — JUICE ITEM 1a)

  // fire — hold LMB, or always when AUTO-FIRE accessibility toggle is on
  P.fireCd -= dt;
  const gt = CFG.gunTiers[P.gun - 1];
  // PHASE 2B — FAST FIRE rides the same multiplier chain as the meta overcharge
  const rate = gt.rate * (META.upg.overcharge ? 1.18 : 1) * (1 + P.up.fastFire * CFG.upgrades.fastFirePct);
  if ((META.autoFire || M.down) && P.fireCd <= 0) {
    P.fireCd = 1 / rate;
    fireBullet(gt);
  }

  // i-frame blink
  P.iframes = Math.max(0, P.iframes - dt);
  P.flashT = Math.max(0, P.flashT - dt);

  // sprite transform — JUICE ITEM 1 rig
  P.squashX = Math.max(0, P.squashX - dt * 1.4);
  P.squashY = Math.max(0, P.squashY - dt * 1.4);
  playerSpr.texture = P.flashT > 0 ? TEX['shipW_' + P.ship.name] : TEX[shipTexName(P.ship)];
  playerSpr.alpha = (P.iframes > 0 ? (Math.sin(S.time * 42) > 0 ? 1 : 0.25) : 1) * S.shipFade;   // × shipFade: the restart fade-in (JUICE 5c)

  // 1b banking — eased lean into lateral velocity (visual only)
  const lat = Math.cos(P.angle) * P.vy - Math.sin(P.angle) * P.vx; // lateral velocity
  const bankT = clamp(lat / P.ship.maxSpeed, -1, 1) * J.bankAngle * Math.PI / 180;
  bankCur += (bankT - bankCur) * damp(J.bankEase, dt);

  // 1a record the current pose for the afterimage trail
  trailBuf.x[trailBuf.head] = P.x;
  trailBuf.y[trailBuf.head] = P.y;
  trailBuf.r[trailBuf.head] = P.angle + bankCur;
  trailBuf.head = (trailBuf.head + 1) % trailBuf.x.length;

  // 1d squash & stretch — along the movement direction, eased back to 1.0
  if (sp > 20) wrapAng = lerpAngle(wrapAng, Math.atan2(P.vy, P.vx), damp(J.squashEase, dt));
  const sk = clamp(sp / (P.ship.maxSpeed * J.stretchFullAt), 0, 1);
  const se = damp(J.squashEase, dt);
  stretchCur += (1 + (J.squashAmount.stretch - 1) * sk - stretchCur) * se;
  squashCur += (1 + (J.squashAmount.squash - 1) * sk - squashCur) * se;

  // JUICE 4d — recoil: render offset only, eases back to zero over recoilMs
  P.recT = Math.max(0, P.recT - dt);
  const rk = P.recT > 0 ? P.recT / P.recT0 : 0;
  shipWrap.position.set(P.x + P.recX * rk, P.y + P.recY * rk);
  shipWrap.rotation = wrapAng;
  shipWrap.scale.set(stretchCur * (1 - P.squashX * 1.6), squashCur * (1 - P.squashY * 1.6));
  playerSpr.rotation = P.angle + bankCur - wrapAng;   // ship still faces the cursor
  playerSpr.scale.set(P.ship.scale);

  // 1c thrust pulse — bright flicker at the tail, ~12 Hz with random jitter
  if (sp > J.pulseMinSpeed) {
    flickPhase += dt * J.pulseRate * TAU * (0.85 + Math.random() * 0.3);
    const f = 0.5 + 0.5 * Math.sin(flickPhase);
    flameSpr.visible = true;
    flameSpr.tint = P.ship.color;
    flameSpr.alpha = clamp(0.30 + 0.45 * f + rand(-0.08, 0.08), 0, 1);
    flameSpr.scale.set(0.55 + 0.5 * f);
  } else {
    flameSpr.visible = false;
  }
}

// JUICE 1a — render the afterimage trail from the pose ring buffer.
// dt-scaled: hit-stop freezes the trail, death slow-mo melts it slowly.
function updateShipTrail (dt) {
  const active = player.alive &&
    (S.mode === 'playing' || S.mode === 'dying' || S.mode === 'paused' || S.mode === 'cards');
  const sp = Math.hypot(player.vx, player.vy);
  const speedK = active
    ? clamp(sp / (player.ship.maxSpeed * J.trailFullAt), 0, 1)
    : 0;
  const n = trailBuf.x.length;
  const melt = damp(1 / Math.max(0.05, J.trailFade), dt);
  for (let i = 0; i < n; i++) {
    const g = trailGhosts[i];
    const t = i / (n - 1);                       // 0 freshest -> 1 oldest
    const aT = active ? J.trailAlpha * (1 - t) * speedK : 0;
    g.alpha += (aT - g.alpha) * melt;
    if (g.alpha < 0.02) { g.visible = false; continue; }
    g.visible = true;
    const idx = (trailBuf.head - 1 - i + n * 2) % n;
    g.position.set(trailBuf.x[idx], trailBuf.y[idx]);
    g.rotation = trailBuf.r[idx];
    g.tint = lerpColor(player.ship.color, player.ship.trail, t);  // cyan -> pink
  }
}

function playerHit (dx, dy, knockMul = 1, dmg = 1) {
  const P = player;
  P.hp -= dmg;
  if (P.hp <= 0) { hudHP(); playerDie(); return; }   // JUICE 5 — death is its own beat: no hurt juice, no hit-stop
  // PHASE 2B — LAST STAND: taking a hit detonates a defensive nova around
  // the ship. Fires AFTER the damage lands (it cannot undo the hit) and
  // before the hurt juice so the burst reads as the answer to the hit.
  if (P.up.lastStand > 0) lastStandBlast();
  P.iframes = DIFF().iframes;
  S.flashA = CFG.feel.hurtFlash;
  S.rgbT = CFG.feel.rgbHurt;
  addTrauma(CFG.feel.traumaHurt);
  hitstop(CFG.feel.hitstopHurt);
  // knockback away from the source
  const d = Math.hypot(dx, dy) || 1;
  P.vx += (dx / d) * 220 * knockMul; P.vy += (dy / d) * 220 * knockMul;
  puff(P.x, P.y, 10, P.ship.color, 160);
  A.hurt();
  if (S.combo > 0) { S.combo = 0; S.comboT = 0; popup(P.x, P.y - 26, 'COMBO LOST', '#8f7fb8', 12); }
  hudHP();
}

/* JUICE ITEM 5a — THE DEATH BEAT. Its own moment, nothing borrowed:
   slow-mo 0.3x for 500ms real + the ship detonates into explosionCount
   pooled particles (ship color — cyan on VECTOR; bigger + slower than kill
   shards) + red edge vignette + death sound HERE at HP <= 0. NO hit-stop,
   NO kill shake, NO hurt flash — and no rings: the beat is clean. The
   GAME OVER slam arrives only after the slow-mo releases (toOver). */
function playerDie () {
  const P = player;
  const DK = CFG.juice.death;
  P.alive = false;
  playerSpr.visible = false;
  M.down = false;
  for (let i = 0; i < DK.explosionCount; i++) {
    const a = rand(TAU), sp = rand(DK.explosionSpeedMin, DK.explosionSpeedMax);
    emit({ tex: TEX.dot, tint: P.ship.color, x: P.x, y: P.y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.6, 1.0), size: rand(1.0, 1.8), drag: 1.8, alpha: 0.9 });
  }
  vignetteFlash();                       // red screen edges — the world flinches
  A.boom();                              // death sound fires on HP <= 0, not on GAME OVER
  S.mode = 'dying';
  S.dyingT = DK.slowMoMs / 1000;         // counts down on rawDt = REAL time
  S.timescale = DK.slowMoScale;          // game time slows; hit-stop machinery untouched
}

/* ===== 05 BULLETS — player gun tiers 1..5 ===== */
const bulletPool = makePool(CFG.pools.bullets, () => spriteOf(TEX.bullet), bulletL);

function fireBullet (gt) {
  const P = player;
  gridShootFlash();                        // JUICE 3a — whole-grid power pulse
  // JUICE 4d — visual recoil: sprite-only nudge opposite the aim. Bullets
  // below still spawn from the un-recoiled P.x/P.y — fast fire can't walk
  // the gun backward, and aim/hitbox never move.
  const JB = CFG.juice.bullet;
  P.recT0 = Math.max(1, JB.recoilMs) / 1000;
  P.recT = P.recT0;
  P.recX = -Math.cos(P.angle) * JB.recoilPx;
  P.recY = -Math.sin(P.angle) * JB.recoilPx;
  // ===== PHASE 2B — the gun reads the run's upgrade bag (data-driven, no
  // per-card if-else): SPREAD adds bullets + widens the fan (and trades a
  // damage step), PIERCE stacks pass-throughs onto the tier's own, RICOCHET
  // rides every bullet as a wall-bounce charge. Tier behavior is untouched
  // when the bag is empty.
  const CU = CFG.upgrades, up = P.up;
  const spL = up.spread;
  const n = gt.count + spL * CU.spreadBullets;
  const fanArc = gt.spread + spL * CU.spreadArcAdd;
  const dmg = spL > 0 ? Math.max(1, gt.dmg - CU.spreadDmgCut) : gt.dmg;
  const pierce = gt.pierce + up.pierce * CU.pierceAdd;
  const bounces = up.ricochet > 0 ? 1 : 0;
  const useFan = n > 1 && !(gt.parallel && spL === 0);   // TWIN keeps its lanes until SPREAD joins
  for (let i = 0; i < n; i++) {
    const b = bulletPool.get();
    if (!b) break;
    let a = P.angle + rand(-PC.bulletSpread, PC.bulletSpread);
    let ox = 0, oy = 0;
    if (n > 1) {
      if (!useFan) {
        // TWIN — two parallel lanes (unchanged while SPREAD is unowned)
        const px = -Math.sin(P.angle), py = Math.cos(P.angle);
        const lane = (i - (n - 1) / 2) * 9;
        ox = px * lane; oy = py * lane;
        a = P.angle + rand(-PC.bulletSpread, PC.bulletSpread);
      } else {
        // fan spread — arc widens with SPREAD stacks
        const t = n === 1 ? 0 : (i / (n - 1)) - 0.5;
        a = P.angle + t * fanArc * 2 + rand(-PC.bulletSpread, PC.bulletSpread);
      }
    }
    b.texture = TEX[gt.tex];
    b.x = P.x + Math.cos(P.angle) * 18 + ox;
    b.y = P.y + Math.sin(P.angle) * 18 + oy;
    b.vx = Math.cos(a) * gt.speed;
    b.vy = Math.sin(a) * gt.speed;
    b.life = gt.life;
    b.dmg = dmg;
    b.pierce = pierce;
    b.bounces = bounces;
    b.last = null;
    b.wob = gt.wave || 0;
    b.wt = 0;
    b.px = -Math.sin(a); b.py = Math.cos(a);
    b.rotation = a;
    b.scale.set(rand(0.9, 1.1));
  }
  // JUICE 4a — one barrel flicker per trigger pull (was: per-bullet puff)
  muzzleFlash(P.x + Math.cos(P.angle) * 18, P.y + Math.sin(P.angle) * 18);
  A.shoot(P.gun);
}

function updateBullets (dt) {
  for (const b of bulletPool.items) {
    if (!b.active) continue;
    b.life -= dt;
    if (b.life <= 0) { bulletPool.release(b); continue; }
    b.wt += dt;
    const wv = b.wob ? Math.cos(b.wt * 16) * b.wob * 420 : 0;
    b.x += (b.vx + b.px * wv) * dt;
    b.y += (b.vy + b.py * wv) * dt;
    if (b.wob) b.rotation = Math.atan2(b.vy + b.py * wv, b.vx + b.px * wv);  // 4b — streak follows true travel dir
    // PHASE 2B — RICOCHET: a bullet carrying bounce charges reflects off the
    // arena walls instead of dying (checked before the out-of-bounds kill so
    // fast bullets can never tunnel through). The clamp pulls it back inside.
    if (b.x < 12 || b.x > W - 12 || b.y < 12 || b.y > H - 12) {
      if (b.bounces > 0) {
        b.bounces--;
        if (b.x < 12)      { b.x = 12;      b.vx = Math.abs(b.vx); }
        else if (b.x > W - 12) { b.x = W - 12; b.vx = -Math.abs(b.vx); }
        if (b.y < 12)      { b.y = 12;      b.vy = Math.abs(b.vy); }
        else if (b.y > H - 12) { b.y = H - 12; b.vy = -Math.abs(b.vy); }
        if (!b.wob) b.rotation = Math.atan2(b.vy, b.vx);
        b.last = null;                                 // fresh path — same enemy can be re-hit
        impactSpark(b.x, b.y, b.vx, b.vy);
      } else { bulletPool.release(b); continue; }
    }
  }
}

/* ===== 06 ENEMIES — drone / hunter / spinner / tank ===== */
const EKIND = {
  drone:   { cfg: CFG.drone,   tex: 'drone',   color: COL.drone,   hi: COL.droneHi   },
  hunter:  { cfg: CFG.enemies.hunter, tex: 'hunter', color: COL.hunter, hi: COL.hunterHi },
  spinner: { cfg: CFG.enemies.spinner, tex: 'spinner', color: COL.spinner, hi: COL.spinnerHi },
  tank:    { cfg: CFG.tank,    tex: 'tank',    color: COL.tank,    hi: COL.tankHi    },
};
const enemyPool = makePool(CFG.pools.enemies, () => spriteOf(TEX.drone), enemyL);
const telePool = makePool(CFG.pools.teles, () => spriteOf(TEX.ring), fxL); // spawn telegraphs

// Phase 2A — windup telegraph: ONE shared Graphics, redrawn every frame from
// live hunter state. A hunter that dies or gets cancelled mid-wind-up can
// never leave an orphan line, and the line vanishes the exact frame the shot
// fires — the telegraph lives strictly BEFORE the bullet, never with it.
const aimG = new PIXI.Graphics();
aimG.blendMode = 'add';
glow.addChild(aimG);           // above enemies/popups, additive + bloomed

// Phase 2A.2 — spinner charge ring: same architecture as the aim line — ONE
// shared additive Graphics redrawn per frame from live state, so a spinner
// that dies mid-wind-up can never leave an orphan ring. The ring expands
// outward (0.35x -> 1.0x chargeRingRadius) and brightens across the wind-up.
const spinnerG = new PIXI.Graphics();
spinnerG.blendMode = 'add';
glow.addChild(spinnerG);

function tierOf (wave) { return 1 + Math.floor((wave - 1) / CFG.waves.tierEvery); }
function enemyHp (kind, tier) {
  const c = EKIND[kind].cfg;
  return c.hp + (tier - 1) * (c.hpPerTier || 0);
}
function sharedSpeedMult () {
  return Math.min(CFG.waves.speedCap, 1 + (S.wave - 1) * 0.055 + (S.tier - 1) * 0.05) * DIFF().speed;
}

function spawnPoint () {
  const I = CFG.world.spawnInset, depth = 90;
  for (let tries = 0; tries < 14; tries++) {
    let x, y;
    const edge = (Math.random() * 4) | 0;
    if (edge === 0)      { x = rand(I, W - I); y = I + rand(depth); }
    else if (edge === 1) { x = rand(I, W - I); y = H - I - rand(depth); }
    else if (edge === 2) { x = I + rand(depth);        y = rand(I, H - I); }
    else                 { x = W - I - rand(depth);    y = rand(I, H - I); }
    if (Math.hypot(x - player.x, y - player.y) >= CFG.waves.minPlayerDist) return { x, y };
  }
  return { x: I + rand(40), y: I + rand(40) };
}

function telegraphSpawn (kind) {
  const t = telePool.get();
  if (!t) return false;
  const p = spawnPoint();
  t.texture = TEX.ring; t.tint = EKIND[kind].color;
  t.x = p.x; t.y = p.y;
  t.t = CFG.waves.telegraph; t.dur = CFG.waves.telegraph;
  t.x0 = p.x; t.y0 = p.y; t.kind = kind;
  t.alpha = 0.9; t.scale.set(1.1);
  return true;
}

function updateTeles (dt) {
  for (const t of telePool.items) {
    if (!t.active) continue;
    t.t -= dt;
    const k = clamp(t.t / t.dur, 0, 1);
    t.scale.set(lerp(0.28, 1.1, k));
    t.alpha = 0.35 + 0.65 * (1 - k) + 0.25 * Math.sin(S.time * 24);
    if (t.t <= 0) {
      telePool.release(t);
      spawnEnemy(t.kind, t.x0, t.y0);
    }
  }
}

function spawnEnemy (kind, x, y) {
  const d = enemyPool.get();
  if (!d) return;
  const K = EKIND[kind], c = K.cfg;
  d.kind = kind; d.cfg = c; d.k = K;
  d.x = x; d.y = y;
  d.vx = 0; d.vy = 0;
  d.hp = enemyHp(kind, S.tier);
  d.radius = c.radius;
  d.phase = rand(TAU);
  d.rotA = rand(TAU);
  d.flashT = 0;
  d.dying = false;               // JUICE 2 — pool reuse safety
  d.spawnK = 0;
  d.scale.set(0.1);
  d.orb = Math.random() < 0.5 ? 1 : -1;      // hunter strafe dir
  d.cool = rand(0.8, 1.6);                   // tank cycle
  d.sprA = rand(TAU);                        // spinner spray offset (spinAngle)
  d.texN = K.tex;
  d.texture = TEX[K.tex];
  d.pivot.set(0, 0);                          // Phase 2A — clear hunter recoil kick
  d.st = kind === 'spinner' ? 'drift' : 'approach';   // Phase 2A/2A.2 state machines
  d.wT = 0; d.cT = 0;
  d.aimX = x; d.aimY = y; d.recT = 0; d.recT0 = 1;
  // Phase 2A.2 — spinner: staggered first drift so spinners spawned together
  // don't pulse in sync; drift heading is random, re-rolled every cycle
  d.dT = rand(0.5, 1) * CFG.enemies.spinner.driftTimeMs / 1000;
  d.driftA = rand(TAU);
  d.ringR = 0; d.ringA = 0;
  if (d.halo) { d.halo.tint = c.colorPrimary; d.halo.visible = false; }  // pool reuse: kind may change
  puff(x, y, 6, K.color, 120);
  ring(x, y, K.color, 1.1, 0.3);
}

// --- enemy bullets ---
const ebPool = makePool(CFG.pools.ebullets, () => spriteOf(TEX.ebullet), bulletL);
// Phase 2A — enemy shots may carry damage + a dedicated texture (the hunter
// comet orb: rotation locks to travel angle so the baked tail points home).
function fireEnemyBullet (x, y, ang, speed, tint, dmg = 1, tex = null) {
  const b = ebPool.get();
  if (!b) return;
  b.x = x; b.y = y;
  const sp = speed * DIFF().bullet;
  b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
  b.life = 7;
  b.tint = tint;
  b.dmg = dmg;
  b.texture = tex || TEX.ebullet;
  b.scale.set(1);
  b.rotation = tex ? ang : 0;
}

function updateEBullets (dt) {
  for (const b of ebPool.items) {
    if (!b.active) continue;
    b.life -= dt;
    if (b.life <= 0 || b.x < 8 || b.x > W - 8 || b.y < 8 || b.y > H - 8) {
      ebPool.release(b); continue;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    // player collision
    if (player.alive && S.mode === 'playing' && player.iframes <= 0) {
      const rr = 4.5 + player.ship.radius;
      if (Math.abs(b.x - player.x) < rr && Math.abs(b.y - player.y) < rr &&
          Math.hypot(b.x - player.x, b.y - player.y) < rr) {
        ebPool.release(b);
        playerHit(player.x - b.x, player.y - b.y, 1, b.dmg || 1);
        continue;
      }
    }
  }
}

// --- Phase 2A — the telegraph: one shared Graphics, redrawn per frame ---
// The line IS the bullet path: hunter nose -> predicted intercept (recomputed
// every frame, so juking re-aims it live). Fades dim purple -> bright white
// across the wind-up. S.aimLines counts live lines (verify hook).
function hunterAimDraw () {
  aimG.clear();
  let n = 0;
  if (S.mode === 'playing') {
    const HC = CFG.enemies.hunter;
    for (const d of enemyPool.items) {
      if (!d.active || d.dying || d.kind !== 'hunter' || d.st !== 'windup') continue;
      const prog = 1 - clamp(d.wT / (HC.windUpMs / 1000), 0, 1);
      const col = lerpColor(HC.colorPrimary, 0xffffff, prog);
      const al = lerp(HC.aimLineAlphaStart, HC.aimLineAlphaEnd, prog);
      const lx = d.aimX - d.x, ly = d.aimY - d.y;
      const ll = Math.hypot(lx, ly) || 1;
      const sx = d.x + (lx / ll) * 12, sy = d.y + (ly / ll) * 12;   // start at the nose
      aimG.moveTo(sx, sy).lineTo(d.aimX, d.aimY)
        .stroke({ width: HC.aimLineWidth, color: col, alpha: al, cap: 'round' });
      aimG.circle(d.aimX, d.aimY, 2.6)
        .stroke({ width: 1.4, color: col, alpha: al });             // predicted impact pip
      n++;
    }
  }
  S.aimLines = n;
}

// --- Phase 2A.2 — the charge ring: one shared additive Graphics, redrawn per
// frame from live state (same no-orphan architecture as the aim line). A
// spinner that dies mid-wind-up can never leave one behind, and the ring
// vanishes the exact frame the spray fires — telegraph strictly BEFORE the
// bullets. The drawn r/alpha are stashed on the enemy for the verify hook.
function spinnerChargeDraw () {
  spinnerG.clear();
  let n = 0;
  if (S.mode === 'playing') {
    const SC = CFG.enemies.spinner;
    for (const d of enemyPool.items) {
      if (!d.active || d.dying || d.kind !== 'spinner' || d.st !== 'windup') continue;
      const prog = 1 - clamp(d.wT / (SC.windUpMs / 1000), 0, 1);
      const r = lerp(SC.chargeRingRadius * 0.35, SC.chargeRingRadius, prog);
      const a = SC.chargeRingAlpha * (0.35 + 0.65 * prog) * (0.85 + 0.15 * Math.sin(S.time * 18));
      spinnerG.circle(d.x, d.y, r).stroke({ width: 2, color: SC.colorPrimary, alpha: a });
      d.ringR = r; d.ringA = a;
      n++;
    }
  }
  S.spinnerRings = n;
}

// --- per-kind AI ---
function updateEnemies (dt) {
  const chasing = player.alive && S.mode === 'playing';
  const actives = [];
  // dying = frozen white corpse awaiting its pop (JUICE 2) — no AI, no motion
  for (const d of enemyPool.items) if (d.active && !d.dying) actives.push(d);

  for (const d of actives) {
    d.flashT = Math.max(0, d.flashT - dt);
    d.spawnK = Math.min(1, d.spawnK + dt * 4.5);
    const c = d.cfg;

    if (d.kind === 'drone') {
      d.rotA += c.spin * dt;
      if (chasing) {
        const dx = player.x - d.x, dy = player.y - d.y;
        const wob = Math.sin(S.time * c.weaveFreq + d.phase) * c.weaveAmp;
        const ang = Math.atan2(dy, dx) + wob;
        const ms = c.baseSpeed * Math.min(c.speedCap, 1 + (S.wave - 1) * c.speedRamp) * DIFF().speed;
        const dvx = Math.cos(ang) * ms - d.vx, dvy = Math.sin(ang) * ms - d.vy;
        const dl = Math.hypot(dvx, dvy) || 1;
        const st = Math.min(c.accel * dt, dl);
        d.vx += (dvx / dl) * st; d.vy += (dvy / dl) * st;
        // separation — keeps the swarm readable instead of one blob
        for (const o of actives) {
          if (o === d || o.kind !== 'drone') continue;
          const sx = d.x - o.x, sy = d.y - o.y;
          const sd = Math.hypot(sx, sy);
          if (sd > 0.01 && sd < c.sepDist) {
            d.vx += (sx / sd) * c.sepForce * dt;
            d.vy += (sy / sd) * c.sepForce * dt;
          }
        }
      } else { d.vx *= Math.exp(-0.8 * dt); d.vy *= Math.exp(-0.8 * dt); }
      d.texture = d.flashT > 0 ? TEX.droneW : TEX.drone;
      d.rotation = d.rotA;
      const pulse = 1 + Math.sin(S.time * c.pulseRate + d.phase) * c.pulseAmp;
      const popIn = 1 - Math.pow(1 - d.spawnK, 3);
      d.scale.set(popIn * pulse * (d.spawnK < 1 ? 1.15 : 1));
    }

    else if (d.kind === 'hunter') {
      // Phase 2A — APPROACH -> WINDUP -> FIRE -> COOLDOWN. It stops to shoot,
      // tells you exactly where the shot is going for windUpMs, and is fully
      // killable the whole time. That trade IS the enemy.
      const windup = chasing && d.st === 'windup';
      if (chasing) {
        const dx = player.x - d.x, dy = player.y - d.y;
        const dist = Math.hypot(dx, dy) || 1;
        const ms = c.speed * sharedSpeedMult();
        const angP = Math.atan2(dy, dx);

        if (d.st === 'approach') {
          if (dist > c.fireRange) {
            // smooth steering toward the player — same accel model as drone/tank,
            // but it stops at fireRange instead of ramming
            const dvx = Math.cos(angP) * ms - d.vx, dvy = Math.sin(angP) * ms - d.vy;
            const dl = Math.hypot(dvx, dvy) || 1;
            const st = Math.min(c.accel * dt, dl);
            d.vx += (dvx / dl) * st; d.vy += (dvy / dl) * st;
          } else {
            d.vx *= Math.exp(-6 * dt); d.vy *= Math.exp(-6 * dt);   // brake into firing stance
            if (d.spawnK >= 1) { d.st = 'windup'; d.wT = c.windUpMs / 1000; }
          }
        } else if (d.st === 'windup') {
          d.vx *= Math.exp(-9 * dt); d.vy *= Math.exp(-9 * dt);     // planted — does not move
          d.wT -= dt;
          // predicted intercept, recomputed EVERY frame — the line tracks your
          // current velocity, so a juke re-aims the telegraph in real time.
          // Clamped to the arena: the bullet dies at the wall anyway, and the
          // telegraph must never draw into the letterbox.
          const tof = dist / (c.bulletSpeed * DIFF().bullet);
          d.aimX = clamp(player.x + player.vx * tof * c.leadFactor, 8, W - 8);
          d.aimY = clamp(player.y + player.vy * tof * c.leadFactor, 8, H - 8);
          if (d.wT <= 0) {
            const ang = Math.atan2(d.aimY - d.y, d.aimX - d.x);
            fireEnemyBullet(d.x + Math.cos(ang) * 12, d.y + Math.sin(ang) * 12, ang,
              c.bulletSpeed, c.colorBullet, c.bulletDamage, TEX.hbullet);
            muzzleFlash(d.x + Math.cos(ang) * 16, d.y + Math.sin(ang) * 16, c.colorBullet);
            d.recT0 = Math.max(1, CFG.juice.bullet.recoilMs) / 1000;
            d.recT = d.recT0;                                       // render-only kick (pivot)
            A.ui();
            d.st = 'cooldown'; d.cT = c.cooldownMs / 1000;
          }
        } else { // cooldown — stalk back toward the player, then re-decide
          d.cT -= dt;
          const dvx = Math.cos(angP) * ms - d.vx, dvy = Math.sin(angP) * ms - d.vy;
          const dl = Math.hypot(dvx, dvy) || 1;
          const st = Math.min(c.accel * dt, dl);
          d.vx += (dvx / dl) * st; d.vy += (dvy / dl) * st;
          if (d.cT <= 0) d.st = 'approach';
        }

        // nose rides the aim while winding (the line comes off the gun), the
        // player otherwise
        const face = d.st === 'windup' ? Math.atan2(d.aimY - d.y, d.aimX - d.x) : angP;
        d.rotation = lerpAngle(d.rotation, face, damp(14, dt));
      } else { d.vx *= Math.exp(-0.8 * dt); d.vy *= Math.exp(-0.8 * dt); }

      d.texture = d.flashT > 0 ? TEX.hunterW : TEX.hunter;

      // wind-up glow — additive halo, brighter + pulsing as the shot nears
      if (!d.halo) {
        d.halo = spriteOf(TEX.dot);
        d.halo.tint = c.colorPrimary;
        d.addChild(d.halo);
      }
      if (windup) {
        const prog = 1 - clamp(d.wT / (c.windUpMs / 1000), 0, 1);
        d.halo.visible = true;
        d.halo.alpha = prog * (0.42 + 0.22 * Math.sin(S.time * 22));
        d.halo.scale.set(2.6 + prog * 1.1);
      } else d.halo.visible = false;

      // recoil — render-only pivot kick (local -x = straight back off the shot)
      d.recT = Math.max(0, d.recT - dt);
      d.pivot.set(d.recT > 0 ? 2.6 * (d.recT / d.recT0) : 0, 0);

      const popIn = 1 - Math.pow(1 - d.spawnK, 3);
      d.scale.set(popIn);
    }

    else if (d.kind === 'spinner') {
      // Phase 2A.2 — DRIFT -> WINDUP -> SPRAY -> DRIFT. It NEVER chases: a
      // lazy drifting position puzzle. The charge (planted body, faster spin,
      // expanding ring) IS the telegraph — read the pulse, find the gap. The
      // whole ring of bullets lands in ONE frame, radial, not sequential.
      const windup = chasing && d.st === 'windup';
      // the sprite always rotates — slow idle read, fast during the charge
      d.rotA += (windup ? c.spinRateWindup : c.spinRateIdle) * TAU * dt;

      if (chasing) {
        if (d.st === 'drift') {
          // bounce the heading off the walls BEFORE steering into them
          const wm = CFG.world.bound + 8;
          if ((d.x < wm && Math.cos(d.driftA) < 0) ||
              (d.x > W - wm && Math.cos(d.driftA) > 0)) d.driftA = Math.PI - d.driftA;
          if ((d.y < wm && Math.sin(d.driftA) < 0) ||
              (d.y > H - wm && Math.sin(d.driftA) > 0)) d.driftA = -d.driftA;
          const ms = c.speed * sharedSpeedMult();
          const dvx = Math.cos(d.driftA) * ms - d.vx, dvy = Math.sin(d.driftA) * ms - d.vy;
          const dl = Math.hypot(dvx, dvy) || 1;
          const st = Math.min(c.accel * dt, dl);
          d.vx += (dvx / dl) * st; d.vy += (dvy / dl) * st;
          d.dT -= dt;
          if (d.dT <= 0 && d.spawnK >= 1) { d.st = 'windup'; d.wT = c.windUpMs / 1000; }
        } else if (d.st === 'windup') {
          d.vx *= Math.exp(-9 * dt); d.vy *= Math.exp(-9 * dt);   // planted — does not move
          d.wT -= dt;
          if (d.wT <= 0) {
            const n = c.bulletCount;
            for (let i = 0; i < n; i++) {
              fireEnemyBullet(d.x, d.y, d.sprA + c.bulletAngleOffset + i / n * TAU,
                c.bulletSpeed, c.colorBullet, c.bulletDamage, TEX.sbullet);
            }
            d.sprA += (TAU / n) * 0.5;   // gaps shift every cycle — no parked safe spot
            muzzleFlash(d.x, d.y, c.colorBullet);
            A.ui();
            d.st = 'spray'; d.cT = c.sprayRecoveryMs / 1000;
          }
        } else { // spray recovery — brief settle, then drift on a new heading
          d.cT -= dt;
          d.vx *= Math.exp(-4 * dt); d.vy *= Math.exp(-4 * dt);
          if (d.cT <= 0) { d.st = 'drift'; d.dT = c.driftTimeMs / 1000; d.driftA = rand(TAU); }
        }
      } else { d.vx *= Math.exp(-0.8 * dt); d.vy *= Math.exp(-0.8 * dt); }

      d.texture = d.flashT > 0 ? TEX.spinnerW : TEX.spinner;
      d.rotation = d.rotA;

      // wind-up glow — same additive halo pattern as the hunter, spinner color
      if (!d.halo) {
        d.halo = spriteOf(TEX.dot);
        d.halo.tint = c.colorPrimary;
        d.addChild(d.halo);
      }
      if (windup) {
        const prog = 1 - clamp(d.wT / (c.windUpMs / 1000), 0, 1);
        d.halo.visible = true;
        d.halo.alpha = prog * (0.42 + 0.22 * Math.sin(S.time * 22));
        d.halo.scale.set(2.6 + prog * 1.1);
      } else d.halo.visible = false;

      const popIn = 1 - Math.pow(1 - d.spawnK, 3);
      d.scale.set(popIn);
    }

    else if (d.kind === 'tank') {
      d.rotA += 0.4 * dt;
      if (chasing) {
        const dx = player.x - d.x, dy = player.y - d.y;
        const dist = Math.hypot(dx, dy) || 1;
        const ms = c.baseSpeed * sharedSpeedMult();
        const dvx = (dx / dist) * ms - d.vx, dvy = (dy / dist) * ms - d.vy;
        const dl = Math.hypot(dvx, dvy) || 1;
        const st = Math.min(c.accel * dt, dl);
        d.vx += (dvx / dl) * st; d.vy += (dvy / dl) * st;

        // periodic radial ring
        d.cool -= dt;
        if (d.cool <= 0 && d.spawnK >= 1) {
          d.cool = c.fireCd;
          const n = Math.min(14, c.ringCount + (S.tier - 1) * 2);
          const off = rand(TAU);
          for (let i = 0; i < n; i++) {
            fireEnemyBullet(d.x, d.y, off + i / n * TAU, c.ringSpeed, d.k.color);
          }
          ring(d.x, d.y, d.k.color, 1.5, 0.3);
          A.ui();
        }
        d.rotation = Math.atan2(dy, dx);
      } else { d.vx *= Math.exp(-0.8 * dt); d.vy *= Math.exp(-0.8 * dt); }
      d.texture = d.flashT > 0 ? TEX.tankW : TEX.tank;
      const popIn = 1 - Math.pow(1 - d.spawnK, 3);
      d.scale.set(popIn);
    }

    d.x += d.vx * dt; d.y += d.vy * dt;

    // soft walls
    const m = CFG.world.bound + 8;
    if (d.x < m)     { d.x = m;     if (d.vx < 0) d.vx *= -0.5; }
    if (d.x > W - m) { d.x = W - m; if (d.vx > 0) d.vx *= -0.5; }
    if (d.y < m)     { d.y = m;     if (d.vy < 0) d.vy *= -0.5; }
    if (d.y > H - m) { d.y = H - m; if (d.vy > 0) d.vy *= -0.5; }
  }

  // contact damage
  if (chasing && player.iframes <= 0) {
    for (const d of actives) {
      const rr = player.ship.radius + d.radius;
      if (Math.abs(d.x - player.x) < rr && Math.abs(d.y - player.y) < rr) {
        if (Math.hypot(d.x - player.x, d.y - player.y) < rr) {
          if (d.kind === 'drone') {
            killEnemy(d, false);      // kamikaze drone pops — no score
          } else {
            // heavy bodies shove you and stay alive
            const dx = player.x - d.x, dy = player.y - d.y;
            const dd = Math.hypot(dx, dy) || 1;
            player.vx += (dx / dd) * 260; player.vy += (dy / dd) * 260;
            d.vx -= (dx / dd) * 80; d.vy -= (dy / dd) * 80;
          }
          playerHit(player.x - d.x, player.y - d.y, d.kind === 'tank' ? d.cfg.knock : 1);
          break;
        }
      }
    }
  }
}

/* ===== 07 COLLISIONS — player bullets vs enemies ===== */
function collideBullets () {
  for (const b of bulletPool.items) {
    if (!b.active) continue;
    for (const d of enemyPool.items) {
      if (!d.active || d.dying || d === b.last) continue;   // dying corpse: no re-hits
      const rr = 3.5 + d.radius;
      if (Math.abs(b.x - d.x) < rr && Math.abs(b.y - d.y) < rr) {
        if (Math.hypot(b.x - d.x, b.y - d.y) < rr) {
          b.last = d;
          hitEnemy(d, b.vx, b.vy, b.dmg);
          if (b.pierce > 0) { b.pierce -= 1; b.dmg = Math.max(1, b.dmg - 1); }
          else { bulletPool.release(b); break; }
        }
      }
    }
  }
}

function hitEnemy (d, bvx, bvy, dmg) {
  d.hp -= dmg;
  if (d.hp > 0) {
    d.flashT = 0.07;
    const bl = Math.hypot(bvx, bvy) || 1;
    const kb = d.kind === 'tank' ? 60 : 190;
    d.vx += (bvx / bl) * kb; d.vy += (bvy / bl) * kb;
    // JUICE 4c — white impact sparks at the contact point (was: tinted puff,
    // which read identical to the kill). White-on-survive vs enemy-colored
    // burst on kill = "hitting it" vs "killed it".
    impactSpark(d.x - (bvx / bl) * d.radius * 0.7, d.y - (bvy / bl) * d.radius * 0.7, bvx, bvy);
    return;
  }
  killEnemy(d, true);
}

/* --- JUICE ITEM 2 — THE KILL MOMENT (staged, one trigger) ------------------
   Death frame : 1) WHITE FLASH — sprite goes pure white for exactly
                    juice.kill.whiteFlashFrames rendered frames (the "hit")
                 4) SCREEN SHAKE — addKillShake() (plays through the freeze)
                 5) HIT-STOP — the whole loop freezes for juice.kill.hitStopMs
                 + kill sound + existing grid pulse
   Flash end   : 2) PARTICLE BURST   3) SHOCKWAVE RING   6) SCORE POPUP
                 (+ tank radial death burst rides along with the pop)
--------------------------------------------------------------------------- */
const pendingKills = [];

function killEnemy (d, giveScore) {
  const KB = CFG.juice.kill;
  d.dying = true;                                  // frozen white corpse — no AI, no hits
  if (d.halo) d.halo.visible = false;              // Phase 2A — corpse carries no windup glow
  d.texture = TEX[d.k.tex + 'W'];                  // 1) WHITE FLASH starts this frame
  pendingKills.push({ d, x: d.x, y: d.y, k: d.k, kind: d.kind, giveScore, flash: KB.whiteFlashFrames });
  addKillShake();                                  // 4) SCREEN SHAKE
  if (S.mode === 'playing') hitstop(KB.hitStopMs / 1000);   // 5) HIT-STOP — never during the death beat (JUICE 5a)
  if (d.kind === 'tank') A.boom(); else A.kill();  // (grid kill flash = local ripple at the pop, JUICE 3b)
}

// Frame-exact flash countdown — runs on RENDERED frames (not dt), so the white
// flash still elapses and the pop still lands DURING the hit-stop freeze.
function updateKillFlash () {
  for (let i = pendingKills.length - 1; i >= 0; i--) {
    const p = pendingKills[i];
    if (p.flash > 0) { p.flash--; continue; }
    pendingKills.splice(i, 1);
    finalizeKill(p);
  }
}

function finalizeKill (p) {
  const KB = CFG.juice.kill;
  const d = p.d, K = p.k, x = p.x, y = p.y;
  enemyPool.release(d);
  burstKill(x, y, K.color);                        // 2) PARTICLE BURST (enemy color)
  const s0 = d.radius / 24, s1 = d.radius * KB.shockwaveScale / 24;  // TEX.ring baked at r=24
  ring(x, y, K.color, s1, KB.shockwaveMs / 1000, s0, 1);             // 3) SHOCKWAVE RING
  gridRipple(x, y, K.color);                       // 3b) LOCAL grid ripple — enemy color
  if (p.kind === 'tank') {
    // death burst — do not stand still (mechanic, rides with the pop)
    const n = 10, off = rand(TAU);
    for (let i = 0; i < n; i++) fireEnemyBullet(x, y, off + i / n * TAU, 160, K.color);
  }
  // PHASE 2B — EXPLOSIVE KILLS: the corpse detonates and damages neighbors
  // (chained kills resolve through the same deferred pop a frame later)
  if (player.up.explosive > 0) explosiveBurst(x, y);
  if (p.giveScore) {
    const mult = comboMult();
    const pts = Math.round(d.cfg.score * mult * DIFF().mult / 10) * 10;
    S.score += pts;
    S.kills += 1;
    S.combo += 1;
    S.comboT = CFG.combo.window;
    popup(x, y, '+' + pts, '#2cf6ff', 17, KB.popupRise, KB.popupDurationMs / 1000);  // 6) cyan
    const pcol = mult >= 3.5 ? '#ff2ec4' : mult >= 2 ? '#ffd23c' : COL.core;
    if (mult >= 2) popup(x, y - 20, '×' + mult.toFixed(1), pcol, 12);  // existing combo readout
    hudScore();
    checkNewBest();
    rollDrops(x, y, p.kind);
  }
}

/* ===== 07b PICKUPS — heart / gun / coin with magnet pull ===== */
const pickupPool = makePool(CFG.pools.pickups, () => spriteOf(TEX.coin), pickupL);
const PICKUP_TEX = { heart: TEX.heart, gun: TEX.gunpk, coin: TEX.coin };

function dropPickup (x, y, kind) {
  const p = pickupPool.get();
  if (!p) return;
  p.kind = kind;
  p.texture = PICKUP_TEX[kind];
  p.x = x; p.y = y;
  const a = rand(TAU);
  p.vx = Math.cos(a) * rand(50, 110);
  p.vy = Math.sin(a) * rand(50, 110);
  p.life = CFG.pickup.life;
  p.t = rand(TAU);
  p.scale.set(1);
  p.alpha = 1;
}

function rollDrops (x, y, kind) {
  const t = CFG.drops[kind];
  if (pickupPool.countActive() >= CFG.pickup.maxField && kind !== 'tank') return;
  const nCoins = t.coins ? t.coins() : (Math.random() < t.coin ? 1 : 0);
  for (let i = 0; i < nCoins; i++) dropPickup(x + rand(-14, 14), y + rand(-14, 14), 'coin');
  if (Math.random() < t.heart && player.hp < player.hpMax) dropPickup(x, y, 'heart');
  else if (Math.random() < t.gun && player.gun < 5) dropPickup(x, y, 'gun');
}

function comboMult () {
  return Math.min(CFG.combo.cap, 1 + S.combo * CFG.combo.step);
}

function updatePickups (dt) {
  // PHASE 2B — MAGNET card stacks with the meta MAGNETIZER (multiplicative)
  const magnetR = CFG.pickup.magnetR * (META.upg.magnet ? 1.7 : 1) *
                  (1 + player.up.magnet * CFG.upgrades.magnetRadiusPct);
  for (const p of pickupPool.items) {
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0) { pickupPool.release(p); continue; }
    p.t += dt;
    // magnet pull
    if (player.alive) {
      const dx = player.x - p.x, dy = player.y - p.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < magnetR) {
        p.vx += (dx / d) * CFG.pickup.pull * dt;
        p.vy += (dy / d) * CFG.pickup.pull * dt;
        const sp = Math.hypot(p.vx, p.vy);
        if (sp > CFG.pickup.pullCap) { p.vx *= CFG.pickup.pullCap / sp; p.vy *= CFG.pickup.pullCap / sp; }
      } else {
        p.vx *= Math.exp(-1.4 * dt); p.vy *= Math.exp(-1.4 * dt);
      }
      if (d < CFG.pickup.collect) { collectPickup(p); continue; }
    } else {
      p.vx *= Math.exp(-1.4 * dt); p.vy *= Math.exp(-1.4 * dt);
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
    // visuals: blink out, coins spin, hearts/guns bob
    p.alpha = p.life < 2.5 ? (Math.sin(S.time * 22) > 0 ? 1 : 0.25) : 1;
    if (p.kind === 'coin') {
      p.rotation = 0;
      p.scale.set(0.35 + 0.65 * Math.abs(Math.cos(p.t * 4.2)));
    } else {
      p.scale.set(1 + Math.sin(p.t * 3.4) * 0.08);
      p.rotation = Math.sin(p.t * 2.2) * 0.12;
    }
  }
}

function collectPickup (p) {
  const x = p.x, y = p.y;
  pickupPool.release(p);
  if (p.kind === 'coin') {
    // PHASE 2B — MAGNET: +25% coin gain per stack (rounded per coin)
    const val = Math.round(CFG.pickup.coinValue * (1 + player.up.magnet * CFG.upgrades.magnetCoinPct));
    S.runCoins += val;
    popup(x, y, '+' + val + ' CR', '#ffd23c', 14);
    puff(x, y, 5, COL.coin, 90);
    A.coin();
    hudScore();
  } else if (p.kind === 'heart') {
    player.hp = Math.min(player.hpMax, player.hp + 1);
    popup(x, y, '+1 HP', '#ff8fa3', 15);
    ring(x, y, COL.heart, 1.4, 0.35);
    puff(x, y, 6, COL.heart, 100);

/* ===== 08 WAVES — budget director with breathers + tiers ===== */
const Wv = { n: 0, queue: [], spawnCd: 0, phase: 'idle', breatherT: 0 };
// phase: idle (title) | spawning | breather

function buildQueue (budget, wave) {
  const avail = ['drone'];
  if (wave >= CFG.waves.unlock.hunter)  avail.push('hunter');
  if (wave >= CFG.waves.unlock.spinner) avail.push('spinner');
  if (wave >= CFG.waves.unlock.tank)    avail.push('tank');
  const q = [];
  let b = budget, guard = 0;
  while (b > 0 && guard++ < 500) {
    // weighted pick among affordable types
    let total = 0;
    const aff = [];
    for (const k of avail) {
      if (CFG.waves.cost[k] <= b) { aff.push(k); total += CFG.waves.weights[k]; }
    }
    if (!aff.length) { q.push('drone'); b -= 1; continue; }
    let r = Math.random() * total;
    let pick = aff[0];
    for (const k of aff) { r -= CFG.waves.weights[k]; if (r <= 0) { pick = k; break; } }
    q.push(pick);
    b -= CFG.waves.cost[pick];
  }
  // shuffle lightly so bigs don't always come in the same order
  for (let i = q.length - 1; i > 0; i--) {
    if (Math.random() < 0.25) {
      const j = (Math.random() * (i + 1)) | 0;
      [q[i], q[j]] = [q[j], q[i]];
    }
  }
  return q;
}

function startWave (n) {
  Wv.n = n; S.wave = n;
  S.tier = tierOf(n);
  const budget = Math.floor(CFG.waves.budget(n) * DIFF().budget);
  Wv.queue = buildQueue(budget, n);
  Wv.spawnCd = 0.7;
  Wv.phase = 'spawning';
  const tierWave = n > 1 && (n - 1) % CFG.waves.tierEvery === 0;
  if (tierWave) {
    banner('WAVE ' + n + ' — TIER ' + S.tier + ' // THEY ADAPT', '#ffa23c', 30, 1.8);
    A.tier();
    addTrauma(0.18);
  } else {
    banner('WAVE ' + n, COL.text, 40, 1.5);
  }
  hudWave();
  // PHASE 2B — REGEN: heals every regenWaves wave starts, counted from the
  // pick (stacks heal regenHeal x stack count). Silent when already full.
  if (player.up.regen > 0) {
    RUN.regenT++;
    if (RUN.regenT >= CFG.upgrades.regenWaves) {
      RUN.regenT = 0;
      const before = player.hp;
      player.hp = Math.min(player.hpMax, player.hp + CFG.upgrades.regenHeal * player.up.regen);
      if (player.hp > before) {
        popup(player.x, player.y - 30, '+' + (player.hp - before) + ' HP', '#7dff9c', 15);
        ring(player.x, player.y, COL.tank, 1.3, 0.35);
        A.heal();
        hudHP();
      }
    }
  }
}

function countHostiles () {
  return enemyPool.countActive() + telePool.countActive();
}

function wavesUpdate (dt) {
  if (S.mode !== 'playing') return;
  if (Wv.phase === 'spawning') {
    if (Wv.queue.length > 0) {
      Wv.spawnCd -= dt;
      if (Wv.spawnCd <= 0 && countHostiles() < CFG.waves.maxActive) {
        if (telegraphSpawn(Wv.queue.shift())) {
          Wv.spawnCd = CFG.waves.spawnInterval(Wv.n) * rand(0.75, 1.25);
        }
      }
    } else if (countHostiles() === 0) {
      // PHASE 2B — every wave clear funnels into the card screen: the clear
      // moment lands first (bonus popup), then screenMs of breathing room,
      // then the dim + cards. (The old breather phase is superseded — the
      // card screen IS the breather now.)
      Wv.phase = 'cards';
      Wv.cardT = Math.max(1, CFG.upgrades.screenMs) / 1000;
      const bonus = CFG.waves.clearBonus(Wv.n);
      S.score += bonus;
      popup(W / 2, H / 2 - 60, 'WAVE CLEAR  +' + bonus, COL.player, 22);
      hudScore();
      checkNewBest();
    }
  } else if (Wv.phase === 'cards') {
    // still 'playing' during the delay — the arena stays alive and readable
    // (stray enemy bullets can still be dodged) until the cards come up
    Wv.cardT -= dt;
    if (Wv.cardT <= 0) openCardScreen();
  }
}
