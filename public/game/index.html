/* --- JUICE 5c — RESTART WIPE: a black band TRAVELS across (never a fade).
   in : band grows from the left edge until the screen is black (restartWipeMs)
   @ cover : startRun() resets EVERYTHING under the black, ship alpha -> 0
   out: band keeps travelling right and reveals the new run while the ship
        fades in from black over restartFadeInMs (the only fade-in).
   R-mash safe: beginRestart() no-ops unless phase === 'none'. */
function easeInOutQ (k) { return k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }
function drawWipeBand (f, b) {          // covered region = [b, f]
  wipeG.clear();
  if (f - b < 0.5) return;
  wipeG.rect(b, 0, f - b, H).fill({ color: 0x020006, alpha: 1 });
  const edge = RS.phase === 'in' ? f : b;             // neon lip on the moving edge
  wipeG.rect(edge - 2, 0, 4, H).fill({ color: COL.player, alpha: 0.85 });
}
function beginRestart () {
  if (RS.phase !== 'none' || S.mode !== 'over') return;   // mash guard — no double restart, no stacking
  RS.phase = 'in'; RS.t = 0;
  wipeG.visible = true;
  drawWipeBand(0, 0);
}
function updateWipe (rawDt) {
  if (RS.phase === 'none') return;
  const DK = CFG.juice.death;
  const dur = Math.max(1, DK.restartWipeMs) / 1000;
  RS.t += rawDt;
  if (RS.phase === 'in') {
    const k = clamp(RS.t / dur, 0, 1);
    drawWipeBand(W * easeInOutQ(k), 0);
    if (k >= 1) {                              // fully covered — swap the world in the dark
      RS.phase = 'out'; RS.t = 0;
      startRun();
      S.shipFade = 0;                          // ship fades in from black (the only fade-in)
    }
  } else {                                     // 'out'
    const k = clamp(RS.t / dur, 0, 1);
    drawWipeBand(W, W * easeInOutQ(k));
    S.shipFade = Math.min(1, S.shipFade + rawDt / (Math.max(1, DK.restartFadeInMs) / 1000));
    if (k >= 1) { RS.phase = 'none'; wipeG.visible = false; S.shipFade = 1; }
  }
}

/* --- JUICE 5b — game-over screen animators, ALL on real time (rawDt):
   slam (GAME OVER drops in, world jolts on impact) / score countup
   (0 -> final, ease-out) / NEW BEST gold pulse (3x, then holds) /
   PRESS R gentle 0.5 <-> 1.0 sine. */
function updateOverFx (rawDt) {
  const DK = CFG.juice.death;
  if (S.slamT < S.slamDur) {
    S.slamT += rawDt;
    const k = clamp(S.slamT / S.slamDur, 0, 1);
    overC.alpha = clamp(k * 1.6, 0, 1);              // dim + content ride in with the slam
    goWrap.y = -130 * (1 - k) * (1 - k);             // ease-in drop from above
    goWrap.alpha = clamp(k * 3, 0, 1);
    if (k >= 1 && !S.slamHit) { S.slamHit = true; addSlamShake(); }   // jolt on IMPACT
  }
  if (S.countT < DK.scoreCountupMs / 1000) {
    S.countT += rawDt;
    const k = clamp(S.countT / (DK.scoreCountupMs / 1000), 0, 1);
    overScore.text = pad(Math.round(S.countTo * (1 - (1 - k) * (1 - k))), 6);
  }
  if (newBestT.visible) {
    S.nbT += rawDt;
    const nk = clamp(S.nbT / (DK.newBestFlashMs / 1000), 0, 1);
    const a = 0.3 + 0.7 * Math.abs(Math.sin(Math.PI * DK.newBestPulseCount * nk));
    newBestT.alpha = nk >= 1 ? 1 : lerp(a, 1, clamp((nk - 0.85) / 0.15, 0, 1));
  }
  S.promptT += rawDt;
  overPromptT.alpha = 0.75 + 0.25 * Math.sin(TAU * S.promptT / (Math.max(1, DK.pressRPulseMs) / 1000));
}

/* ===== 11 AUDIO — Web Audio synth, zero files ===== */
const A = (() => {
  let ctx = null, master = null, noiseBuf = null;
  let muted = !!META.muted;
  function init () {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : CFG.audio.master;
    master.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5 | 0, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function resume () { if (ctx && ctx.state === 'suspended') ctx.resume(); }
  function tone ({ type, f0, f1, dur, vol, at }) {
    if (!ctx || muted) return;
    const t = ctx.currentTime + (at || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(1, f0), t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function noise ({ dur, vol, lp0, lp1, at }) {
    if (!ctx || muted) return;
    const t = ctx.currentTime + (at || 0);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(Math.max(40, lp0), t);
    f.frequency.exponentialRampToValueAtTime(Math.max(40, lp1), t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + 0.03);
  }
  return {
    init, resume,
    shoot (gun) {
      const c = CFG.audio.shoot;
      tone({ type: c.type, f0: c.f0 * (1 + gun * 0.07) * rand(0.94, 1.06), f1: c.f0 * c.fMul, dur: c.dur, vol: c.vol });
    },
    kill ()  { const c = CFG.audio.kill; noise(c.noise); tone(c.tone); },
    hurt ()  { const c = CFG.audio.hurt; tone(c.tone); noise(c.noise); },
    coin ()  { for (const t of CFG.audio.coin.tones) tone(t); },
    gun ()   { const c = CFG.audio.gun; tone(c.tone); noise(c.noise); },
    heal ()  { for (const t of CFG.audio.heal.tones) tone(t); },
    ui ()    { tone(CFG.audio.ui.tone); },
    boom ()  { const c = CFG.audio.boom; noise(c.noise); tone(c.tone); },
    tier ()  { for (const t of CFG.audio.tier.tones) tone(t); },
    toggleMute () {
      muted = !muted;
      META.muted = muted; saveMeta();
      if (master) master.gain.value = muted ? 0 : CFG.audio.master;
      return muted;
    },
    setMuted (m) { muted = !!m; if (master) master.gain.value = muted ? 0 : CFG.audio.master; },
    get muted () { return muted; },
  };
})();

/* ===== 12 INPUT ===== */
const K = {};
const M = { x: W / 2, y: H / 2 - 120, down: false };

function toWorld (e) {
  const r = app.canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - offX) / scaleS,
    y: (e.clientY - r.top - offY) / scaleS,
  };
}
window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  K[e.code] = true;
  A.init(); A.resume();
  if (e.code === 'KeyM') {
    const m = A.toggleMute();
    popup(M.x, M.y - 20, m ? 'MUTED' : 'SOUND ON', COL.textDim, 13);
  } else if (e.code === 'KeyF') {
    META.autoFire = !META.autoFire; saveMeta();
    popup(M.x, M.y - 20, 'AUTO-FIRE ' + (META.autoFire ? 'ON' : 'OFF'), COL.textDim, 13);
    A.ui();
  } else if ((S.mode === 'title') && (e.code === 'Space' || e.code === 'Enter')) startRun();
  else if ((S.mode === 'over') && (e.code === 'KeyR' || e.code === 'Space' || e.code === 'Enter')) beginRestart();
  else if (S.mode === 'over' && e.code === 'Escape' && RS.phase === 'none') showTitle();
  else if (S.mode === 'paused' && e.code === 'KeyQ') showTitle();
  else if (S.mode === 'cards') {              // PHASE 2B — 1/2/3 picks instantly
    const ki = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[e.code];
    if (ki !== undefined) pickCard(ki);
  }
  else if (e.code === 'KeyP' || e.code === 'Escape') {
    if (S.mode === 'playing') setPause(true);
    else if (S.mode === 'paused') setPause(false);
  }
});
window.addEventListener('keyup', e => { K[e.code] = false; });

app.canvas.addEventListener('pointermove', e => {
  const w = toWorld(e);
  M.x = w.x; M.y = w.y;
});
app.canvas.addEventListener('pointerdown', e => {
  A.init(); A.resume();
  const w = toWorld(e);
  M.x = w.x; M.y = w.y;
  if (S.mode === 'title') startRun();
  else if (S.mode === 'over') beginRestart();       // JUICE 5c — click restarts through the wipe too
  else if (S.mode === 'paused') setPause(false);
  else if (S.mode === 'cards') {                    // PHASE 2B — click a card to pick it
    const i = cardAt(w.x, w.y);
    if (i >= 0) pickCard(i);
  }
  else if (S.mode === 'playing') M.down = true;
});
window.addEventListener('pointerup', () => { M.down = false; });
window.addEventListener('pointercancel', () => { M.down = false; });
window.addEventListener('blur', () => { M.down = false; if (S.mode === 'playing') setPause(true); });
app.canvas.addEventListener('contextmenu', e => e.preventDefault());
// audio unlock from the DOM menu too
window.addEventListener('pointerdown', () => { A.init(); A.resume(); }, { capture: true });

/* ===== 14 UPGRADES — PHASE 2B run cards (the roguelike backbone) =====
   Between waves the run pauses and the player picks 1 of 3. Exactly 12 cards,
   uniform rarity, content HERE / numbers in CFG.upgrades. Uniques leave the
   pool once owned; everything else stacks. The pick applies to player.up and
   every system reads the bag — per-run only, reset on death, never persisted. */

const RUN = { regenT: 0 };                    // per-run card bookkeeping (REGEN counter)

const CAT_COLOR = {                           // card color = category
  weapon: 0x2cf6ff, mobility: 0xff2ec4, defense: 0x3cff6e, reward: 0xffd23c,
};

const UPGRADES = [
  // WEAPON
  { id: 'pierce',    cat: 'weapon',   unique: false, name: 'PIERCE',          desc: 'Bullets punch through 1 extra enemy.' },
  { id: 'spread',    cat: 'weapon',   unique: false, name: 'SPREAD',          desc: '+2 bullets per shot, wider arc, -1 damage.' },
  { id: 'ricochet',  cat: 'weapon',   unique: true,  name: 'RICOCHET',        desc: 'Bullets bounce off walls once.' },
  { id: 'explosive', cat: 'weapon',   unique: true,  name: 'EXPLOSIVE KILLS', desc: 'Killed enemies burst, damaging nearby enemies.' },
  // MOBILITY
  { id: 'fastFire',  cat: 'mobility', unique: false, name: 'FAST FIRE',       desc: '+25% fire rate.' },
  { id: 'quickFeet', cat: 'mobility', unique: false, name: 'QUICK FEET',      desc: '+20% move speed.' },
  { id: 'dashCharge',cat: 'mobility', unique: false, name: 'DASH CHARGE',     desc: '+1 dash charge, ready immediately.' },
  { id: 'fastDash',  cat: 'mobility', unique: false, name: 'FAST DASH',       desc: 'Dash cooldown reduced by 40%.' },
  // DEFENSE
  { id: 'maxHp',     cat: 'defense',  unique: false, name: 'MAX HP',          desc: '+1 max HP and heal 1.' },
  { id: 'regen',     cat: 'defense',  unique: false, name: 'REGEN',           desc: 'Heal 1 HP every 3 waves.' },
  { id: 'lastStand', cat: 'defense',  unique: true,  name: 'LAST STAND',      desc: 'Taking a hit kills every enemy within 80px.' },
  // REWARD
  { id: 'magnet',    cat: 'reward',   unique: false, name: 'MAGNET',          desc: '+50% pickup radius and +25% coin gain.' },
];

function dashChargesMax () {
  return CFG.player.dash.charges + player.up.dashCharge * CFG.upgrades.dashChargeAdd;
}
function dashCd () {
  return Math.max(0.25, CFG.player.dash.cooldownMs / 1000 * (1 - player.up.fastDash * CFG.upgrades.fastDashCut));
}

function applyUpgrade (u) {
  player.up[u.id] = (player.up[u.id] || 0) + 1;
  if (u.id === 'maxHp') {
    player.hpMax += CFG.upgrades.maxHpAdd;
    player.hp = Math.min(player.hpMax, player.hp + CFG.upgrades.maxHpHeal);
    buildHpPips(); hudHP();
  } else if (u.id === 'dashCharge') {
    player.dashMax = dashChargesMax();
    player.dashCharges = Math.min(player.dashCharges + 1, player.dashMax);   // the new charge ships ready
    buildDashPips(); hudDash();
  }
}

// --- draw logic: 3 DISTINCT cards, uniques already owned leave the pool ---
function eligibleUpgrades () {
  return UPGRADES.filter(u => !(u.unique && (player.up[u.id] || 0) > 0));
}
function drawCards () {
  const bag = eligibleUpgrades();
  const out = [];
  while (out.length < 3 && bag.length) {
    out.push(bag.splice((Math.random() * bag.length) | 0, 1)[0]);
  }
  return out;
}

// --- LAST STAND nova (fired from playerHit) + EXPLOSIVE corpse burst (fired
// from finalizeKill). Both are plain damage events: chained kills ride the
// existing deferred-pop path, so cascades resolve a frame at a time. ---
function lastStandBlast () {
  const R = CFG.upgrades.lastStandRadius;
  ring(player.x, player.y, player.ship.color, R / 24, 0.32, 0.25, 1);
  gridRipple(player.x, player.y, player.ship.color);
  puff(player.x, player.y, 12, player.ship.color, R);
  addTrauma(0.2);
  A.kill();
  for (const d of enemyPool.items) {
    if (!d.active || d.dying) continue;
    if (Math.hypot(d.x - player.x, d.y - player.y) <= R + d.radius) killEnemy(d, true);
  }
}
function explosiveBurst (x, y) {
  const CU = CFG.upgrades;
  ring(x, y, 0xffaa44, Math.max(0.5, CU.explosiveRadius / 24), 0.22, 0.15, 0.9);
  puff(x, y, 5, 0xffaa44, 90);
  for (const d of enemyPool.items) {
    if (!d.active || d.dying) continue;
    const dx = d.x - x, dy = d.y - y;
    if (Math.hypot(dx, dy) <= CU.explosiveRadius + d.radius) hitEnemy(d, dx || 1, dy, CU.explosiveDamage);
  }
}

function paintSlot (i) {
  const u = UG.draw[i];
  if (!u) return;
  const sl = UG.slots[i], c = CAT_COLOR[u.cat], hk = sl.slot.hoverK;
  const g = sl.bg.clear();
  g.roundRect(-UG_W / 2, -UG_H / 2, UG_W, UG_H, 10).fill({ color: 0x0a0018, alpha: 0.92 });
  g.roundRect(-UG_W / 2, -UG_H / 2, UG_W, UG_H, 10).stroke({ width: 7, color: c, alpha: 0.10 + 0.16 * hk });
  g.roundRect(-UG_W / 2, -UG_H / 2, UG_W, UG_H, 10).stroke({ width: 2.5, color: c, alpha: 0.72 + 0.28 * hk });
  g.roundRect(-UG_W / 2 + 3, -UG_H / 2 + 3, UG_W - 6, UG_H - 6, 7)
    .stroke({ width: 1, color: lerpColor(c, 0xffffff, 0.6), alpha: 0.28 + 0.45 * hk });
  g.rect(-UG_W / 2 + 18, -106, UG_W - 36, 1.5).fill({ color: c, alpha: 0.45 + 0.3 * hk });
}

function drawIcon (g, id, c) {
  g.clear();
  const hi = lerpColor(c, 0xffffff, 0.55);
  const L = (x1, y1, x2, y2, w = 3, col = c, a = 0.95) =>
    g.moveTo(x1, y1).lineTo(x2, y2).stroke({ width: w, color: col, alpha: a, cap: 'round' });
  switch (id) {
    case 'pierce':      // arrow punching through two gates
      L(-30, 0, 24, 0, 3.5);
      g.poly([24, -7, 36, 0, 24, 7]).fill({ color: hi, alpha: 0.95 });
      L(-14, -15, -14, 15, 2.5, c, 0.55);
      L(6, -15, 6, 15, 2.5, c, 0.55);
      break;
    case 'spread': {    // fan of rays off a muzzle point
      for (let j = -2; j <= 2; j++) {
        const a = j * 0.42;
        L(-26, 18, -26 + Math.sin(a) * 46, 18 - Math.cos(a) * 46, 3, j === 0 ? hi : c, j === 0 ? 0.95 : 0.6);
      }
      g.circle(-26, 18, 4).fill({ color: hi });
      break;
    }
    case 'ricochet':    // bounce path off a floor line
      L(-32, 18, 36, 18, 2.5, c, 0.45);
      L(-30, -16, 2, 16, 3.5);
      L(2, 16, 30, -16, 3.5, hi);
      g.circle(2, 16, 4).fill({ color: hi });
      break;
    case 'explosive': { // star burst
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * TAU, r1 = i % 2 ? 16 : 26, r2 = i % 2 ? 27 : 34;
        L(Math.cos(a) * r1, Math.sin(a) * r1, Math.cos(a) * r2, Math.sin(a) * r2, 2.8);
      }
      g.circle(0, 0, 5).fill({ color: hi });
      break;
    }
    case 'fastFire':    // »» chevrons
      for (let i = 0; i < 3; i++) {
        const x = -28 + i * 19;
        g.poly([x, -14, x + 14, 0, x, 14]).fill({ color: i === 2 ? hi : c, alpha: 0.45 + i * 0.27 });
      }
      break;
    case 'quickFeet':   // speed lines + dart
      L(-32, -9, -6, -9, 3, c, 0.8);
      L(-38, 0, -12, 0, 3, c, 0.5);
      L(-32, 9, -6, 9, 3, c, 0.8);
      g.poly([2, -13, 30, 0, 2, 13]).fill({ color: hi, alpha: 0.95 });
      break;
    case 'dashCharge':  // dash chevrons + a popped charge pip
      g.poly([-14, -15, 0, 0, -14, 15]).fill({ color: c, alpha: 0.85 });
      g.poly([2, -15, 16, 0, 2, 15]).fill({ color: hi, alpha: 0.95 });
      g.circle(30, -12, 4.5).fill({ color: hi });
      g.circle(30, -12, 8.5).stroke({ width: 1.5, color: c, alpha: 0.5 });
      break;
    case 'fastDash':    // long dart + motion streaks
      g.poly([-4, -13, 28, 0, -4, 13]).fill({ color: hi });
      L(-30, -6, -12, -6, 2.5, c, 0.4);
      L(-36, 0, -12, 0, 2.5, c, 0.7);
      L(-30, 6, -12, 6, 2.5, c, 0.4);
      break;
    case 'maxHp':       // plus in a ring
      g.circle(0, 0, 24).stroke({ width: 2.5, color: c, alpha: 0.85 });
      g.roundRect(-3.5, -14, 7, 28, 2).fill({ color: hi });
      g.roundRect(-14, -3.5, 28, 7, 2).fill({ color: hi });
      break;
    case 'regen':       // plus + orbit arc
      g.roundRect(-3, -12, 6, 24, 2).fill({ color: hi });
      g.roundRect(-12, -3, 24, 6, 2).fill({ color: hi });
      g.arc(0, 0, 26, -0.6, 2.4).stroke({ width: 2.5, color: c, alpha: 0.75 });
      break;
    case 'lastStand':   // shield
      g.poly([0, -24, 22, -14, 22, 4, 0, 24, -22, 4, -22, -14])
        .fill({ color: 0x0a1a10, alpha: 0.92 }).stroke({ width: 3, color: c, alpha: 0.95 });
      g.poly([0, -13, 12, -7, 12, 3, 0, 13, -12, 3, -12, -7])
        .stroke({ width: 1.5, color: hi, alpha: 0.55 });
      break;
    case 'magnet':      // horseshoe
      g.roundRect(-18, -14, 10, 26, 3).fill({ color: c, alpha: 0.95 });
      g.roundRect(8, -14, 10, 26, 3).fill({ color: c, alpha: 0.95 });
      g.roundRect(-18, 6, 36, 9, 3).fill({ color: c, alpha: 0.95 });
      g.roundRect(-18, -21, 10, 6, 2).fill({ color: 0xffffff, alpha: 0.95 });
      g.roundRect(8, -21, 10, 6, 2).fill({ color: 0xffffff, alpha: 0.95 });
      break;
  }
}

function refreshSlotContent (i) {
  const u = UG.draw[i];
  if (!u) return;
  const sl = UG.slots[i];
  sl.catT.text = u.cat.toUpperCase();
  sl.catT.style.fill = CAT_COLOR[u.cat];
  sl.nameT.text = u.name;
  sl.descT.text = u.desc;
  sl.keyT.text = '[ ' + (i + 1) + ' ]';
  drawIcon(sl.icon, u.id, CAT_COLOR[u.cat]);
}

function cardAt (wx, wy) {
  for (let i = 0; i < UG.draw.length; i++) {
    const s = UG.slots[i].slot;
    if (Math.abs(wx - s.x) <= UG_W / 2 + 8 && Math.abs(wy - s.y) <= UG_H / 2 + 8) return i;
  }
  return -1;
}

// --- hover PREVIEW — a 1-second, looping, VISUAL-ONLY read of what the card
// does to the ship. Runs on its own sprite set above the dim (world coords
// map 1:1: worldRoot and overlayRoot share the letterbox transform). ---
const pvSprites = [];
function pvGet () {
  for (const o of pvSprites) if (!o.active) return o;
  if (pvSprites.length >= 48) return null;
  const spr = spriteOf(TEX.dot);
  spr.visible = false;
  pvL.addChild(spr);
  const o = { spr, active: false };
  pvSprites.push(o);
  return o;
}
function pvSpawn (tex, tint, x, y, vx, vy, life, size, grow = 0, delay = 0, drag = 0) {
  const o = pvGet();
  if (!o) return;
  o.active = true;
  o.spr.texture = tex;
  o.spr.tint = tint;
  o.spr.position.set(x, y);
  o.spr.scale.set(size);
  o.spr.rotation = 0;
  o.spr.visible = delay <= 0;
  o.vx = vx; o.vy = vy;
  o.life = o.maxLife = life;
  o.size = size; o.grow = grow; o.delay = delay; o.drag = drag;
}
function updatePreview (dt) {
  for (const o of pvSprites) {
    if (!o.active) continue;
    if (o.delay > 0) {
      o.delay -= dt;
      if (o.delay <= 0) o.spr.visible = true; else continue;
    }
    o.life -= dt;
    if (o.life <= 0) { o.active = false; o.spr.visible = false; continue; }
    const k = o.life / o.maxLife;
    if (o.drag) { const dk = Math.exp(-o.drag * dt); o.vx *= dk; o.vy *= dk; }
    o.spr.x += o.vx * dt; o.spr.y += o.vy * dt;
    o.spr.alpha = Math.min(1, k * 1.6);
    o.spr.scale.set(o.grow ? o.size * (1 + (1 - k) * o.grow) : o.size * (0.5 + 0.5 * k));
  }
}
function clearPreview () {
  for (const o of pvSprites) { o.active = false; o.spr.visible = false; }
  UG.previewId = null;
}
function spawnPreview (id) {
  const P = player, CU = CFG.upgrades;
  const a = P.angle;                                   // ship faces the cursor — the hovered card
  const nx = P.x + Math.cos(a) * 20, ny = P.y + Math.sin(a) * 20;
  const pc = P.ship.color;
  switch (id) {
    case 'spread': {
      for (let j = -2; j <= 2; j++) {
        pvSpawn(TEX.bullet, pc, nx, ny, Math.cos(a + j * 0.28) * 430, Math.sin(a + j * 0.28) * 430, 0.45, 0.9, 0, Math.max(0, j * 0.04));
      }
      pvSpawn(TEX.dot, 0xffffff, nx, ny, 0, 0, 0.12, 1.4, 1.5);
      break;
    }
    case 'pierce': {
      pvSpawn(TEX.droneW, 0xff2b4e, P.x + Math.cos(a) * 150, P.y + Math.sin(a) * 150, 0, 0, 1.0, 1.1, 0.3);
      pvSpawn(TEX.bullet, pc, nx, ny, Math.cos(a) * 560, Math.sin(a) * 560, 0.42, 1.0);
      break;
    }
    case 'ricochet': {
      const tx = P.x < W / 2 ? CFG.world.bound + 6 : W - CFG.world.bound - 6;
      const t1 = Math.max(0.05, Math.abs(tx - nx) / 620);
      pvSpawn(TEX.bullet, pc, nx, ny, (tx - nx) / t1, 0, t1, 1.0);
      pvSpawn(TEX.dot, pc, tx, ny, 0, 0, 0.2, 1.2, 1.2, t1);
      pvSpawn(TEX.bullet, pc, tx, ny, -(tx - nx) / t1 * 0.55, -320, 0.45, 1.0, 0, t1);
      break;
    }
    case 'explosive': {
      const ex = P.x + Math.cos(a) * 90, ey = P.y + Math.sin(a) * 90;
      pvSpawn(TEX.ring, 0xffaa44, ex, ey, 0, 0, 0.3, 0.4, 2.2);
      for (let i = 0; i < 6; i++) {
        const ra = i / 6 * TAU;
        pvSpawn(TEX.spark, 0xffaa44, ex, ey, Math.cos(ra) * 150, Math.sin(ra) * 150, 0.3, 0.7, 0, i * 0.05);
      }
      break;
    }
    case 'fastFire':
      for (let i = 0; i < 3; i++) {
        pvSpawn(TEX.dot, 0xffffff, nx, ny, Math.cos(a) * 70, Math.sin(a) * 70, 0.14, 1.5, 1.2, i * 0.16);
      }
      break;
    case 'quickFeet':
      for (let i = 0; i < 3; i++) {
        pvSpawn(TEX['shipW_' + P.ship.name], lerpColor(pc, P.ship.trail, i / 3),
          P.x, P.y, Math.cos(a) * (210 - i * 55), Math.sin(a) * (210 - i * 55), 0.4, P.ship.scale * (0.85 - i * 0.15), 0, i * 0.09);
      }
      break;
    case 'dashCharge':
      pvSpawn(TEX.dot, pc, P.x - 24, P.y - 20, 0, 0, 0.5, 1.2, 1.6, 0.1);
      pvSpawn(TEX.dot, pc, P.x + 24, P.y - 20, 0, 0, 0.5, 1.2, 1.6, 0.4);
      pvSpawn(TEX.bullet, pc, nx, ny, Math.cos(a) * 620, Math.sin(a) * 620, 0.3, 1.1);
      break;
    case 'fastDash':
      pvSpawn(TEX.bullet, pc, nx, ny, Math.cos(a) * 720, Math.sin(a) * 720, 0.35, 1.2);
      pvSpawn(TEX.ring, pc, P.x, P.y, 0, 0, 0.4, 1.4, -0.65);
      break;
    case 'maxHp':
      pvSpawn(TEX['ship_' + P.ship.name], pc, P.x + Math.cos(a) * 60, P.y + Math.sin(a) * 60, 0, 0, 0.9, 0.45, 0.4);
      pvSpawn(TEX.plus, 0x7dff9c, P.x, P.y - 32, 0, -18, 0.8, 1.2, 0.3);
      break;
    case 'regen':
      for (let i = 0; i < 3; i++) {
        const ra = i / 3 * TAU + 0.6;
        pvSpawn(TEX.plus, 0x7dff9c, P.x + Math.cos(ra) * 62, P.y + Math.sin(ra) * 62, -Math.cos(ra) * 72, -Math.sin(ra) * 72, 0.75, 0.9, 0, i * 0.12);
      }
      break;
    case 'lastStand':
      pvSpawn(TEX.ring, pc, P.x, P.y, 0, 0, 0.5, 1.0, CU.lastStandRadius / 24 - 1);
      for (let i = 0; i < 8; i++) {
        const ra = i / 8 * TAU;
        pvSpawn(TEX.spark, pc, P.x, P.y, Math.cos(ra) * 270, Math.sin(ra) * 270, 0.4, 0.8);
      }
      break;
    case 'magnet':
      for (let i = 0; i < 3; i++) {
        const ra = i / 3 * TAU + 1.2;
        pvSpawn(TEX.coin, COL.coin, P.x + Math.cos(ra) * 130, P.y + Math.sin(ra) * 130, -Math.cos(ra) * 200, -Math.sin(ra) * 200, 0.6, 1.1, 0, i * 0.1);
      }
      break;
  }
  UG.previewId = id;
}

// --- screen open / pick / per-frame animators ---
function openCardScreen () {
  if (UG.phase === 'in' || UG.phase === 'absorb') return;
  UG.draw = drawCards();
  if (!UG.draw.length) { startWave(Wv.n + 1); return; }     // degenerate guard
  S.mode = 'cards';
  UG.phase = 'in'; UG.t = 0; UG.hover = -1; UG.previewT = 0; UG.pickIdx = -1;
  cardDim.clear().rect(0, 0, W, H).fill({ color: 0x000000, alpha: 1 });
  cardDim.alpha = 0;
  cardTitle.alpha = 0; cardSub.alpha = 0;
  cardSub.text = 'WAVE ' + Wv.n + ' CLEARED — CLICK OR PRESS 1 / 2 / 3';
  for (let i = 0; i < 3; i++) {
    const sl = UG.slots[i];
    sl.slot.visible = i < UG.draw.length;
    sl.slot.alpha = 0;
    sl.slot.scale.set(0.6);
    sl.slot.hoverK = 0;
    if (sl.slot.visible) refreshSlotContent(i);
  }
  clearPreview();
  cardC.visible = true;
  A.tier();                                  // the pause should sound like a moment
}

function pickCard (i) {
  if (S.mode !== 'cards' || UG.phase !== 'live' || !UG.draw[i]) return;
  UG.phase = 'absorb'; UG.t = 0; UG.pickIdx = i;
  UG.flyFrom = { x: UG.slots[i].slot.x, y: UG.slots[i].slot.y };
  applyUpgrade(UG.draw[i]);                  // the state lands at the moment of choice
  clearPreview();
  A.ui();
}

const outBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };

function cardUpdate (rawDt) {
  if (!cardC.visible) return;
  if (UG.phase === 'in') {
    UG.t += rawDt;
    cardDim.alpha = CFG.upgrades.dimAlpha * clamp(UG.t / 0.22, 0, 1);
    cardTitle.alpha = clamp(UG.t / 0.2, 0, 1);
    cardSub.alpha = clamp((UG.t - 0.08) / 0.2, 0, 1);
    for (let i = 0; i < UG.draw.length; i++) {
      const st = clamp((UG.t - i * 0.08) / 0.26, 0, 1);
      const sl = UG.slots[i];
      sl.slot.alpha = st;
      sl.slot.scale.set(0.6 + 0.4 * outBack(st));
      paintSlot(i);
    }
    if (UG.t >= 0.26 + 0.16 + 0.04) UG.phase = 'live';
  } else if (UG.phase === 'live') {
    const h = cardAt(M.x, M.y);
    if (h !== UG.hover) {
      UG.hover = h;
      if (h >= 0) { A.ui(); UG.previewT = 0; spawnPreview(UG.draw[h].id); }
      else clearPreview();
    }
    for (let i = 0; i < UG.draw.length; i++) {
      const sl = UG.slots[i];
      sl.slot.hoverK += ((i === UG.hover ? 1 : 0) - sl.slot.hoverK) * damp(14, rawDt);
      sl.slot.scale.set(lerp(1, CFG.upgrades.cardGrowScale, sl.slot.hoverK));
      paintSlot(i);
    }
    if (UG.hover >= 0) {
      UG.previewT += rawDt;                  // the 1s preview loops while hovered
      if (UG.previewT >= 1) { UG.previewT -= 1; spawnPreview(UG.draw[UG.hover].id); }
    }
    updatePreview(rawDt);
  } else if (UG.phase === 'absorb') {
    UG.t += rawDt;
    const dur = Math.max(1, CFG.upgrades.absorbMs) / 1000;
    const k = clamp(UG.t / dur, 0, 1), e = k * k;
    const sl = UG.slots[UG.pickIdx];
    sl.slot.x = lerp(UG.flyFrom.x, player.x, e);
    sl.slot.y = lerp(UG.flyFrom.y, player.y, e);
    sl.slot.scale.set(lerp(1, 0.12, e));
    sl.slot.alpha = 1 - e * 0.85;
    for (let i = 0; i < UG.draw.length; i++) {
      if (i !== UG.pickIdx) UG.slots[i].slot.alpha = 1 - e * 2;
    }
    cardDim.alpha = CFG.upgrades.dimAlpha * (1 - e);
    cardTitle.alpha = clamp(1 - e * 2.5, 0, 1);
    cardSub.alpha = clamp(1 - e * 2.5, 0, 1);
    if (k >= 1) {
      cardC.visible = false;
      UG.phase = 'idle';
      player.flashT = 0.18;                  // brief white flash on the ship
      puff(player.x, player.y, 10, player.ship.color, 150);
      ring(player.x, player.y, player.ship.color, 1.3, 0.3);
      popup(player.x, player.y - 34, UG.draw[UG.pickIdx].name, '#eaf6ff', 15);
      A.gun();
      S.mode = 'playing';
      startWave(Wv.n + 1);                   // screen un-dimmed, next wave begins
    }
  }
}

/* ===== 13 RUN CONTROL + MAIN LOOP ===== */
function startRun () {
  hideOverlays();
  const ui = document.getElementById('ui');
  if (ui) ui.style.display = 'none';
  S.score = 0; S.kills = 0; S.bestBeaten = false; S.wave = 0; S.tier = 1;
  S.runCoins = 0; S.combo = 0; S.comboT = 0;
  S.timescale = 1; S.hitstop = 0; S.trauma = 0; S.flashA = 0;
  S.gridPulse = 0; S.dyingT = 0; S.rgbT = 0;
  S.kMag = 0; S.kx = 0; S.ky = 0; S.gridShoot = 0; pendingKills.length = 0;   // JUICE 2+3 reset
  // JUICE 5 reset — death beat, over-screen animators, restart fade state
  S.vigA = 0; vignetteSpr.alpha = 0;
  S.shipFade = 1;
  S.countT = 0; S.countTo = 0; S.nbT = 0; S.promptT = 0;
  S.slamT = 0; S.slamDur = Math.max(1, CFG.juice.death.gameOverSlamMs) / 1000; S.slamHit = false;
  overC.alpha = 1; goWrap.y = 0; goWrap.alpha = 1; newBestT.visible = false;
  // PHASE 2B — card screen + run-card state reset (upgrades die with the run)
  cardC.visible = false; UG.phase = 'idle'; UG.draw = []; UG.hover = -1; UG.pickIdx = -1;
  clearPreview();
  RUN.regenT = 0;
  bulletPool.releaseAll(); ebPool.releaseAll();
  partPool.releaseAll(); ringPool.releaseAll(); ripplePool.releaseAll(); muzzlePool.releaseAll();
  ghostPool.releaseAll(); popupPool.releaseAll(); telePool.releaseAll();
  enemyPool.releaseAll(); pickupPool.releaseAll();
  aimG.clear(); spinnerG.clear();                  // Phase 2A/2A.2 — no orphan telegraph
  playerReset();
  buildHpPips();
  buildDashPips();
  hudScore(); hudHP(); hudGun();
  Wv.phase = 'idle';
  S.mode = 'playing';
  startWave(1);
}

app.ticker.add(tk => {
  const rawDt = Math.min(tk.deltaMS, 34) / 1000;
  let dt;
  if (S.hitstop > 0) { S.hitstop -= rawDt; dt = 0; }
  else dt = rawDt * S.timescale;
  S.time += dt;

  fxUpdate(dt, rawDt);
  reticle.position.set(M.x, M.y);
  reticle.visible = S.mode === 'playing' || S.mode === 'dying' || S.mode === 'paused' || S.mode === 'cards';
  reticle.alpha = (0.7 + 0.3 * Math.sin(S.time * 6)) * S.shipFade;   // × shipFade: fade-in with the ship
  reticle.rotation = S.time * 0.6;

  if (S.mode === 'playing') {
    playerUpdate(dt);
    updateBullets(dt);
    updateEBullets(dt);
    updateTeles(dt);
    updateEnemies(dt);
    collideBullets();
    updatePickups(dt);
    wavesUpdate(dt);
    hudCombo(dt);
  } else if (S.mode === 'cards') {
    cardUpdate(rawDt);                   // PHASE 2B — the world freezes, the screen breathes (real time)
  } else if (S.mode === 'dying') {
    updateBullets(dt); updateEBullets(dt); updateTeles(dt);
    updateEnemies(dt); collideBullets(); updatePickups(dt);
    S.dyingT -= rawDt;
    if (S.dyingT <= 0) toOver();
  } else if (S.mode === 'over') {
    updateBullets(dt); updateEBullets(dt); updateEnemies(dt); updatePickups(dt);
  }

  hunterAimDraw();                       // Phase 2A — redraw the windup telegraph
  spinnerChargeDraw();                   // Phase 2A.2 — redraw the charge rings
  updateParticles(dt); updateRings(dt); updateRipples(dt); updateGhosts(dt); updatePopups(dt);
  updateKillFlash();                     // JUICE 2 — frame-exact white-flash countdown
  updateMuzzles();                       // JUICE 4a — frame-exact muzzle flicker
  updateShipTrail(dt);
  updateBanner(dt);

  if (overC.visible) updateOverFx(rawDt);   // JUICE 5b — slam / countup / pulses, real time
  updateWipe(rawDt);                        // JUICE 5c — restart band travels on real time
});

// Dev hooks (?debug=1)
if (location.search.includes('debug')) {
  window.NV = {
    app, S, CFG, META, player, DIFF,
    pools: { bullet: bulletPool, eb: ebPool, enemy: enemyPool, pickup: pickupPool,
             tele: telePool, part: partPool, ring: ringPool, ghost: ghostPool, popup: popupPool,
             ripple: ripplePool, muzzle: muzzlePool },
    spawnEnemy, startRun, showTitle, toOver, impactSpark, muzzleFlash, shipWrap, M,
    aimG, buildQueue,
    hunters: () => enemyPool.items.filter(d => d.active && d.kind === 'hunter'),
    spinners: () => enemyPool.items.filter(d => d.active && d.kind === 'spinner'),
    spinnerState: () => enemyPool.items.filter(d => d.active && d.kind === 'spinner')
      .map(d => ({ st: d.st, dT: +d.dT.toFixed(4), wT: +d.wT.toFixed(4), cT: +d.cT.toFixed(4),
        sprA: +d.sprA.toFixed(4), rotA: +d.rotA.toFixed(4), driftA: +d.driftA.toFixed(4),
        ringR: +d.ringR.toFixed(2), ringA: +d.ringA.toFixed(3), hp: d.hp,
        spawnK: +d.spawnK.toFixed(3), haloVisible: !!(d.halo && d.halo.visible),
        x: Math.round(d.x), y: Math.round(d.y), vx: +d.vx.toFixed(1), vy: +d.vy.toFixed(1) })),
    hunterState: () => enemyPool.items.filter(d => d.active && d.kind === 'hunter')
      .map(d => ({ st: d.st, wT: +d.wT.toFixed(4), cT: +d.cT.toFixed(4), spawnK: +d.spawnK.toFixed(3),
        x: Math.round(d.x), y: Math.round(d.y), aimX: Math.round(d.aimX), aimY: Math.round(d.aimY),
        hp: d.hp, dist: Math.round(Math.hypot(player.x - d.x, player.y - d.y)) })),
    beginRestart, vignetteFlash, RS, wipeG, vignetteSpr,
    forceDie: () => { player.hp = 1; playerHit(1, 0); },
    over: { c: overC, score: overScore, label: overLabel, best: overBest, wave: overWave,
            coins: overCoins, prompt: overPromptT, newBest: newBestT, go: goWrap },
    Wv, startWave, telegraphSpawn, pendingKills, TEX,
    killAll: () => { pendingKills.length = 0; enemyPool.releaseAll(); telePool.releaseAll(); ebPool.releaseAll(); },
    giveGun: n => { player.gun = clamp(n || player.gun + 1, 1, 5); S.gun = player.gun; hudGun(); },
    addCR: n => { S.runCoins += (n || 50); hudScore(); },
    addCoins: n => { META.coins += (n || 100); saveMeta(); renderTitle(); },
    forceKill: () => { for (const d of enemyPool.items) if (d.active) killEnemy(d, true); },
    hitEnemy,
    hitMe: () => playerHit(1, 0),
    // PHASE 2B — card screen + run upgrades (debug)
    UPGRADES, RUN,
    giveUpg: id => { const u = UPGRADES.find(x => x.id === id); if (u) applyUpgrade(u); },
    cardState: () => ({ mode: S.mode, phase: UG.phase, open: cardC.visible,
      draw: UG.draw.map(u => u.id), hover: UG.hover, dimA: +cardDim.alpha.toFixed(3),
      slots: UG.slots.slice(0, UG.draw.length).map(s => ({ x: Math.round(s.slot.x), y: Math.round(s.slot.y),
        a: +s.slot.alpha.toFixed(2), sc: +s.slot.scale.x.toFixed(3), key: s.keyT.text })) }),
    eligible: () => eligibleUpgrades().map(u => u.id),
    draw3: () => drawCards().map(u => u.id),
    openCards: () => { Wv.phase = 'cards'; Wv.cardT = 0; openCardScreen(); },
    skipDelay: () => { Wv.cardT = 0; },
    pickCard,
    dash: () => ({ charges: player.dashCharges, max: player.dashMax,
      cdT: +player.dashCdT.toFixed(3), dashT: +player.dashT.toFixed(3) }),
    preview: () => ({ id: UG.previewId, active: !!UG.previewId,
      n: pvSprites.filter(o => o.active).length }),
    lastStandBlast, explosiveBurst,
  };
}

resize();
hudScore(); hudHP();
showTitle();

})().catch(err => {
  console.error('[NeonVoid] boot failure:', err);
  const el = document.getElementById('boot-error');
  if (el) { el.style.display = 'flex'; el.innerHTML += '<br><small>' + (err && err.message ? err.message : err) + '</small>'; }
});

</script>
